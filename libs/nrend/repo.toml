# Repoman package setup:
[repo_upload]
enabled = true
package_name = "nrend"
package_version = "${file:${root}/VERSION}+cu118-${platform}"

files = [
    ["${root}/out/nrend/include", "include"],
    ["${root}/out/nrend/lib/*", "lib"],
    ["${root}/VERSION", "VERSION"],
    ["${root}/README.md", "README.md"],
    ["${root}/PACKAGE-LICENSES", "PACKAGE-LICENSES"],
    ["${root}/PACKAGE-INFO.yaml", "PACKAGE-INFO.yaml"],
]

[repo_symstore]
enabled = true
strip = true
delete_pdbs = true
paths = ["${root}/out/nrend"]
