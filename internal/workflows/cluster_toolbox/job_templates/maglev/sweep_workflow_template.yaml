version: 2
schedule: '@once'
tags:
  cost-center: ct_toronto_ai
tasks:
  - name: train-nre-sweep
    # Number of Maglev jobs (sweep agents) to spawn
    replicas: placeholder
    image: placeholder
    command: /bin/bash
    args:
      - -euxc
      - |
        nvidia-smi -L
        nvidia-smi

        pip install wandb --break-system-packages
        wandb agent ${WANDB_SWEEP_STRING}

    inputs:
      # modify the workflow paths below
      - url: swift://pdx.s8k.io/team-ncore/nre-benchmark/v1/
        # Define secret via CLI: maglev storage-secrets set team-ncore \
        # --access-key-id team-ncore --secret-access-key <s3_secret_key>
        storageSecret: team-ncore
        selector: '(76b46042-ba8f-11eb-a9b2-00044baf74dc@1621641716100213-1621641729800003)'
    group: selector
    workerPool: gpu-large
    env:
      WANDB_SWEEP_STRING: placeholder
    secrets:
      - name: wandb-nvidia-toronto
        # Define via CLI: maglev secrets set wandb-nvidia-toronto -k WANDB_API_KEY -v <YOUR_WANDB_API_KEY>
        keys:
          - key: WANDB_API_KEY  # Used by wandb agent (https://docs.wandb.ai/guides/track/environment-variables)
            env: WANDB_API_KEY

workerPools:
  - name: gpu-large
    # Should match the number of Maglev jobs (sweep agents) to spawn
    workers: placeholder
    cpu: "8"
    gpu: "1"
    mem: 64G
    disk: 64Gi
    resourceShare: placeholder
    nodeConstraints:
      required:
        nodeType: placeholder
