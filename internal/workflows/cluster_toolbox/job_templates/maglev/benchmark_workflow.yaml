version: 2
schedule: '@once'
tags:
  cost-center: ct_toronto_ai
tasks:
  - name: nre-benchmark-sweep
    # Number of Maglev jobs (sweep agents) to spawn
    replicas: placeholder
    image: placeholder
    inputs:
      - url: swift://pdx.s8k.io/team-nre-benchmarking/benchmark_data/2024-06-19
        # Define secret via CLI: maglev storage-secrets set swift-team-nre-benchmarking \
        # --access-key-id swift-team-nre-benchmarking --secret-access-key <s3_secret_key>
        storageSecret: swift-team-nre-benchmarking
        selector: '().*'
    secrets:
      - name: wandb-nvidia-toronto
        # Define via CLI: maglev secrets set wandb-nvidia-toronto -k WANDB_API_KEY -v <YOUR_WANDB_API_KEY>
        keys:
          - key: WANDB_API_KEY  # Used by wandb agent (https://docs.wandb.ai/guides/track/environment-variables)
            env: WANDB_API_KEY
    env:
      WANDB_SWEEP_STRING: placeholder
    command: /bin/bash
    args:
      - -euxc
      - |
        nvidia-smi -L
        nvidia-smi
        ls -l {{input}}
        pip install wandb --break-system-packages
        wandb agent ${WANDB_SWEEP_STRING}

    workerPool: gpu-large

workerPools:
  - name: gpu-large
    workers: placeholder
    cpu: "8"
    gpu: "1"
    mem: 64G
    disk: 64Gi
    resourceShare: placeholder
    nodeConstraints:
      required:
        nodeType: placeholder

