# Template Maglev specification for simple manual dev/test runs of NRE on Maglev

version: 2
schedule: '@once'
tags:
  cost-center: ct_toronto_ai
tasks:
  - name: nre-run-test
    image: nvcr.io/nvidian/ct-toronto-ai/nre_run:latest
    inputs:
      - url: swift://pdx.s8k.io/team-ncore/nre-benchmark/v1/
        # Define secret via CLI: maglev storage-secrets set team-ncore \
        # --access-key-id team-ncore --secret-access-key <s3_secret_key>
        storageSecret: team-ncore
        selector: '(76b46042-ba8f-11eb-a9b2-00044baf74dc@1621641716100213-1621641729800003)'
    command: /bin/bash
    args:
      - -euxc
      - |
        nvidia-smi -L
        nvidia-smi

        find {{input}}

        DATASET_JSON=$(find {{input}} -name "*.json")
        WORKDIR={{output}}/{{job_id}}
        
        echo "Dataset JSON: ${DATASET_JSON}"
        echo "Work dir: ${WORKDIR}"
        

        # Preload CUDA runtime compatibility libraries, as the old Maglev GPU drivers might not support the newer CUDA.
        #LD_PRELOAD=/usr/local/cuda/compat/libcuda.so.520.61.05:/usr/local/cuda/compat/libnvidia-nvvm.so.520.61.05:/usr/local/cuda/compat/libnvidia-ptxjitcompiler.so.520.61.05 \
        /app/run \
          --config-name=apps/AV/NV/ncore_ds_nerfacc_acc_hash_fv_sky_bckg.yaml \
          mode=train \
          dataset.path=${DATASET_JSON} \
          out_dir=${WORKDIR}

        CHECKPOINT=$(find ${WORKDIR} -name "last.ckpt")
        PARSED_CONF=$(find ${WORKDIR} -name "parsed.yaml")

        #LD_PRELOAD=/usr/local/cuda/compat/libcuda.so.520.61.05:/usr/local/cuda/compat/libnvidia-nvvm.so.520.61.05:/usr/local/cuda/compat/libnvidia-ptxjitcompiler.so.520.61.05 \
        /app/run \
          --config-name=${PARSED_CONF} \
          mode=val \
          resume=${CHECKPOINT} \
          dataset.val_camera_frame_step=30 \
          dataset.val_lidar_frame_step=30 \
          system.test.video_fps=10
    secrets:
      - name: wandb-nvidia-toronto
        # Define via CLI: maglev secrets set wandb-nvidia-toronto -k WANDB_API_KEY -v <YOUR_WANDB_API_KEY>
        keys:
          - key: WANDB_API_KEY
            env: WANDB_API_KEY

    workerPool: gpu-large

workerPools:
  - name: gpu-large
    workers: 1
    cpu: "8"
    gpu: "1"
    mem: 64G
    disk: 64Gi
    # Query resource availability via CLI, e.g.: maglev rs usage perception-autonet-pdx --region pdx
    #resourceShare: genpop-pdx                # dgxa100.80gb.perf nodes with A100 GPUs
    #resourceShare: perception-autonet-pdx    # dgxa100.80gb.perf nodes with A100 GPUs
    resourceShare: sdg-rno                    # constellation-v2-ovx nodes with A40 GPUs
    nodeConstraints:
      required:
        #nodeType: dgxa100.80gb.perf
        nodeType: constellation-v2-ovx

