# This Maglev workflow accesses input clips for NRE, as output by another Maglev workflow,
# and renames and copies a selection of the clips to a SwiftStack container dedicated for benchmarking.
# Each run should copy into a different base directory (corresponding to the dataset version),
# so please make sure you change the version before re-launching this workflow.

version: 2
schedule: '@once'
tags:
  cost-center: ct_toronto_ai

tasks:
  # This task selects a subset of all clips generated by the prior workflow, and generates a separate
  # file per selected clip so that the next task processes these in parallel.
  # Could be implemented with one task using replicas, but this way name associations are more explicit.
  - name: select-clips
    workerPool: cpu-workers
    image: nvcr.io/nv-maglev/ubuntu:20.04
    inputs:
      - workflow: janickm-ncore-pp-v3-dataset-nre-benchmark0-aux
        run: 2024.06.19-0646-1deyadrlsmv9i
        task: nerf-merge-data-aux
        selector: '().*'
    command: /bin/bash
    args:
      - -euxo
      - pipefail
      - -c
      - |
        ls {{input}}

        echo 3c291d58-15ad-11ed-b911-00044bf65f0e@1659807907500039-1659807920199978 > {{output}}/clip_001.txt
        echo 3c291d58-15ad-11ed-b911-00044bf65f0e@1659807950800159-1659807956200057 > {{output}}/clip_002.txt
        echo 3c291d58-15ad-11ed-b911-00044bf65f0e@1659807993300112-1659808006899877 > {{output}}/clip_003.txt
        echo c12961c2-4329-11ec-bcb5-00044bcbccac@1636661909300080-1636661922200410 > {{output}}/clip_004.txt
        echo 46ecf9da-3034-11ec-bb19-00044bcbccac@1634576234550328-1634576248150150 > {{output}}/clip_005.txt
        echo 46ecf9da-3034-11ec-bb19-00044bcbccac@1634576458650209-1634576470750118 > {{output}}/clip_006.txt
        echo 46ecf9da-3034-11ec-bb19-00044bcbccac@1634577148649787-1634577157450070 > {{output}}/clip_007.txt
        echo 46ecf9da-3034-11ec-bb19-00044bcbccac@1634577805350099-1634577818149794 > {{output}}/clip_008.txt
        echo 46ecf9da-3034-11ec-bb19-00044bcbccac@1634577962050034-1634577974749987 > {{output}}/clip_009.txt
        echo dccbcec4-5a2b-11ec-a444-00044bf65f0e@1639190675000326-1639190687200039 > {{output}}/clip_010.txt

        for filename in {{output}}/clip_*.txt; do
            dataset=$(cat ${filename})
            echo ${dataset}
            test -d {{input}}/${dataset}
        done

  # This task uploads selected clips to a SwiftStack storage in parallel.
  # Every new run of this workflow should copy into a new base directory representing the version
  # of the copied clips.
  # TODO: fail if the output directory already exists (non-trivial because the output directory is
  # always shown empty even if there is content on SwiftStack)
  - name: upload-clips
    image: nvcr.io/nv-maglev/ubuntu:20.04
    workerPool: cpu-workers
    inputs:
      - task: select-clips
        selector: '(clip_[0-9]{3}).txt'
      - workflow: janickm-ncore-pp-v3-dataset-nre-benchmark0-aux
        run: 2024.06.19-0646-1deyadrlsmv9i
        task: nerf-merge-data-aux
        # All jobs will receive all source clip directories in addition the clip file.
        selector: '().*'
        cross: all
    outputs:
      - url: 'swift://pdx.s8k.io/team-nre-benchmarking/benchmark_data'
        # The path should be the version of the dataset in YYYY-MM-DD format.
        path: '2024-06-19'
        # The user triggering this workflow needs to have access to swift://pdx.s8k.io/team-nre-benchmarking
        # You can request access to that namespace on the NVIDIA Core Storage Service (CSS).
        # The storage secret can then be set and queried via maglev CLI:
        # maglev storage-secrets get swift-team-nre-benchmarking
        # maglev storage-secrets set swift-team-nre-benchmarking \
        #   --access-key-id swift-team-nre-benchmarking --secret-access-key <s3_secret_key>
        storageSecret: swift-team-nre-benchmarking
    command: /bin/bash
    args:
      - -euxo
      - pipefail
      - -c
      - |
        ls -l {{input}}
        ls -l {{output}}

        clip_short_name={{job_id}}
        clip_long_name=$(cat {{input}}/${clip_short_name}.txt)
        echo "Uploading clip ${clip_long_name} as ${clip_short_name}"
        in_dir={{input}}/${clip_long_name}
        ls -l ${in_dir}

        out_dir={{output}}/${clip_short_name}
        mkdir ${out_dir}

        cd ${in_dir}
        time find . -type f -exec md5sum "{}" + > ${out_dir}/checksums.md5

        time cp -sRv ${in_dir}/. ${out_dir}

        cd ${out_dir}
        time md5sum -c checksums.md5

workerPools:
  - name: cpu-workers
    workers: 10
    cpu: "1"
    gpu: "0"
    mem: 16Gi
    disk: 16Gi
    # Preference is for the workflow to run in the PDX cluster because the SwiftStack storage is also in PDX.
    # To query resource availability: maglev rs usage genpop-pdx --region pdx
    resourceShare: genpop-pdx
    nodeConstraints:
      required:
        nodeType: cpu-v2
