# @package _global_
# Default scheme: SJC for everything, sized for the dedicated PPP.
#
# A workflow config picks a scheme via its defaults list, optionally overrides
# default_compute_target / default_gpu, and adds `tasks:` for per-task placement or
# worker-count floors.
# `tasks:` keys match exact canonical task names after workflow/numeric prefixes
# are stripped (for example, `18-reconstruction` matches `reconstruction`).

default_compute_target: sjc
default_gpu: a40

tasks:
  # Tasks pinned to l4 on SJC. Default is a40; these specific tasks have been
  # observed to run better on l4. Scheme-level so switching to default_ci_rno
  # doesn't carry SJC-specific pins.
  reconstruction: { gpu: l4 }
  render_nre: { gpu: l4 }
  mux_videos: { gpu: l4 }
  psnr-semantic-labelmap-images: { gpu: l4 }
  psnr-semantic_labelmaps-videos: { gpu: l4 }
  real_data_extract_saliency_maps: { gpu: l4 }
  ground_mesh-analyzer: { gpu: l4 }
  nvrq-analyzer: { gpu: l4 }
