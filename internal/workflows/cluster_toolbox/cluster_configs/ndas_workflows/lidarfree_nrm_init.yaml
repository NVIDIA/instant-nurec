# @package _global_

defaults:
  - ndas_workflow_base
  - _self_

workflow_name_prefix: nurec-cicd-reconstruct-lidarfree-nrm-init

nrm:
  enabled: true
  nrm_task_name: nrm-export-ply
  prediction_args:
    - --config-name=configs/nrm/apps/pretrained/ngc_c200p16b16_init5c_commercial_v5_prealpha.yaml
    - nrm/dataset/concrete@dataset.predict=ncore_lidar_model_static_full
    - +nrm/apps/options=_long_primitive_merge_lidarfree.yaml
    - nrm/apps/options/sensors@dataset.predict=h81_3cam_960
    - dataset.predict.ncore_json_base_path={{input}}
    - dataset.predict.ncore_json_list_path={{work}}/lidarfree.lst
    - dataset.predict.cuboid_tracks_params.lidar_id=lidar_virtual
    - out_dir="$output_dir"
    - logger.run_id=nrm
    - predict.artifact.enabled=true
    - dataset.predict.frame_batch_samplers.sequential.n_frames_per_sample=18
    - +predict.primitive_merge.frustum_ownership_max_diff_m=5.0
    - predict.primitive_merge.enable_voxelization=true
    - +predict.primitive_merge.voxel_size=0.1
    - +predict.primitive_merge.voxel_fusion_mode=kl_optimal
    - predict.export_ply.falloff_sigma_timestamp_us=-1
    - predict.export_ply.minimum_density=0.01
    - predict.export_ply.minimum_scale=0.0
    - predict.export_ply.minimum_surface_area=0.001
    - predict.export_ply.maximum_velocity=0.01
    - +predict.export_ply.maximum_sky_mask=0.5

car2sim:
  nurec_task_name: nre-run
  reconstruction_args: 
  - --config-name=configs/experimental/nrm_init/car2sim_lidarfree_nrm.yaml
  - logger=dummy
  - model.layers.background.initialization.path={{input}}/nrm/ply/$SEQUENCE_ID/$SEQUENCE_ID.ply
  - out_dir="$output_dir"
  - dataset.path="$train_dataset"
  - dataset.camera_ids="$camera_ids"
  - dataset.samplers.batch_sampler.camera_pixel_sampler.subsample=$SUB_SAMPLER
  - dataset.cuboid_tracks_params.track_label_sources=[AUTOLABEL@camera-DCP]
  - dataset.precompute_rendering_data=true
  - model.renderer.outputs.camera.enable_ray_gradients=false
  - model.renderer.outputs.lidar.enable_ray_gradients=false
  - model.calib.name=skip-calib
  - model.calib.camera.enabled=false
  - mode=train
  training_config: configs/experimental/nrm_init/car2sim_lidarfree_nrm.yaml
  source_wf: lidarfree-weekly-e2e-dev/latest-success
  cut:
    - clipgt-ncore
    - nre-out

switchboard:
  connections:
    car2sim_to_nre_eval:
      with_internal_input: nre-out

    car2sim_to_shim:
      with_internal_input: nre-out

reconstruction_run_binary_tasks:
- nre-run
- nre-out
- render_nre
- psnr-semantic-labelmap-images
- base-pacsim-replay
