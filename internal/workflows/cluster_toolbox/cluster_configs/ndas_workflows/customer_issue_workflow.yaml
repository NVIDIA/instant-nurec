# @package _global_

defaults:
  - ndas_workflow_base
  - _self_

workflow_name_prefix: nurec-customer-issue

car2sim:
  source_wf: lijack-car2sim-nre-eval-test/latest
  cut: []
  training_config: null
  reconstruction_args: null

nre_eval:
  enabled: false

amo_cle:
  enabled: false

nurec_cicd_amo_cle:
  enabled: true

switchboard:
  connections:
    car2sim_to_nurec_cicd_amo_cle:
      force_enable: true
      target_task: trigger-gitlab-pipeline
      replace_input_task: [reconstruction]
      with_internal_input: reconstruction
    car2sim_to_nurec_cicd_amo_cle_2:
      force_enable: true
      target_task: trigger-gitlab-pipeline
      replace_input_task: [swiftstack-uploader]
      with_internal_input: swiftstack-uploader-nre
