# @package _global_
# Worker pool infrastructure: where workloads can run and what each target offers.
#
# Each entry describes one compute target:
#   - `field`     decides whether the resolver writes spec.cluster or spec.resourceShare.
#   - `name`      the maglev cluster or resource-share identifier.
#   - `ppp`       the dedicated PPP / project namespace tied to this target.
#   - `gpus`      generic-name → concrete-node-type, validated at resolve time.
#
# Generic GPU names are shared across targets where the underlying hardware is
# interchangeable for our workloads (e.g. SJC's `a40 = ovxa40.48gb.perf` and
# RNO's `a40 = constellation-v2-ovx` both serve the same scheme entry). Memory
# tier appears in the name only when more than one tier of that GPU class
# exists in the fleet (today: a100).

compute_targets:
  sjc:
    field: cluster
    name: nv-sjc-maglev-001
    ppp: av_sim_car2sim-cicd
    gpus:
      a40: ovxa40.48gb.perf
      l4: mgxl4.24gb.perf
      a100_40gb: dgxa100.40gb.perf

  rno:
    field: resource_share
    name: av-car2sim-cicd-rno
    ppp: av_sim_car2sim-cicd
    gpus:
      a40: constellation-v2-ovx
      a100_80gb: dgxa100.80gb.perf
