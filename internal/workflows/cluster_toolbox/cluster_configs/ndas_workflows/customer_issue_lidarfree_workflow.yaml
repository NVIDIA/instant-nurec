# @package _global_

defaults:
  - ndas_workflow_base
  - _self_

workflow_name_prefix: nurec-customer-issue-lidarfree

car2sim:
  source_wf: lijack-car2sim-nre-eval-test-lidarfree/latest
  cut: []
  training_config: null
  reconstruction_args: null

nre_eval:
  enabled: false

amo_cle:
  enabled: false

swiftstack_version_suffix: '$WORKFLOW_NAME'
swiftstack_version_suffix_tasks:
  - swiftstack-mount-nre
  - swiftstack-uploader-nre

nurec_cicd_amo_cle:
  enabled: true

switchboard:
  connections:
    car2sim_to_nre_eval:
      with_internal_input: nre-out
    car2sim_to_nurec_cicd_amo_cle:
      force_enable: true
      target_task: trigger-gitlab-pipeline
      replace_input_task: [reconstruction]
      with_internal_input: nre-out
    car2sim_to_nurec_cicd_amo_cle_2:
      force_enable: true
      target_task: trigger-gitlab-pipeline
      replace_input_task: [swiftstack-uploader]
      with_internal_input: swiftstack-uploader-nre
