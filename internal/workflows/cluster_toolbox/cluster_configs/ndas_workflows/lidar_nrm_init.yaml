# @package _global_

defaults:
  - ndas_workflow_base
  - _self_

workflow_name_prefix: nurec-cicd-reconstruct-lidar-nrm-init

car2sim:
  training_config: configs/experimental/nrm_init/car2sim_6cam_nrm.yaml
  source_wf: josliu-test-car2sim-lidar-nrm-template/latest
  reconstruction_args:
    - --config-name=configs/experimental/nrm_init/car2sim_6cam_nrm.yaml
    - out_dir=$WORK_RECONSTRUCTION_DIR
    - mode=train
    - logger.name=dummy
    - dataset.path=$DATASET_FILE
    - dataset.seek_offset_sec=0.0
    - dataset.duration_sec=$DURATION
    - dataset.aux_data=True
    - dataset.lidar_ids=$LIDAR_ID_LIST
    - dataset.samplers.batch_sampler.camera_pixel_sampler.subsample=2
    - dataset.cuboid_tracks_params.track_label_sources=[AUTOLABEL]
    - model.layers.background.initialization.path=$NEW_INPUT/nrm/ply/$SEQUENCE_ID/$SEQUENCE_ID.ply
    - model.layers.background.initialization.num_point_cloud_points=1000000
    - dataset.n_samples_per_epoch=30000
  cut:
    - nre-aux-data
    - nrm-export-ply
    - reconstruction

nrm:
  enabled: true
  nrm_task_name: nrm-export-ply
  prediction_args:
    - --config-name=configs/nrm/apps/pretrained/ngc_c200p16b16_init5c_commercial_v5_prealpha.yaml
    - nrm/dataset/concrete@dataset.predict=ncore_lidar_model_static_full
    - +nrm/apps/options=_long_primitive_merge.yaml
    - nrm/apps/options/sensors@dataset.predict=h81_3cam_960
    - dataset.predict.ncore_json_base_path={{input}}
    - dataset.predict.ncore_json_list_path={{work}}/dataset.lst
    - dataset.predict.cuboid_tracks_params.lidar_id=$(grep -o '"lidar[^"]*"' "{{input}}/$SEQUENCE_ID.json")
    - out_dir="$output_dir"
    - logger.run_id=nrm
    - predict.artifact.enabled=true
    - dataset.predict.frame_batch_samplers.sequential.n_frames_per_sample=18
    - +predict.primitive_merge.frustum_ownership_max_diff_m=5.0
    - predict.primitive_merge.enable_voxelization=true
    - +predict.primitive_merge.voxel_size=0.1
    - +predict.primitive_merge.voxel_fusion_mode=kl_optimal
    - predict.export_ply.falloff_sigma_timestamp_us=-1
    - predict.export_ply.minimum_density=0.01
    - predict.export_ply.minimum_scale=0.0
    - predict.export_ply.minimum_surface_area=0.001
    - predict.export_ply.maximum_velocity=0.01
    - +predict.export_ply.maximum_sky_mask=0.5
