# @package _global_

defaults:
  - lidarfree_workflow
  - _self_

workflow_name_prefix: sauron-cicd-lidarfree-nurec

car2sim:
  source_wf: josliu-sauron-cicd-lidarfree-car2sim/latest-success
  retention:
    sauron-detection-tracking: "45d"
  sauron_model: null
  # Regex string replacements applied to task scripts.
  # Override from CLI: car2sim.string_replacements.<name>.replacement=<value>
  string_replacements:
    sauron_inference_args:
      task_name: sauron-detection-tracking
      pattern: '\$PLACEHOLDER_SAURON_ARGS'
      replacement: ''
amo_cle:
  enabled: false
