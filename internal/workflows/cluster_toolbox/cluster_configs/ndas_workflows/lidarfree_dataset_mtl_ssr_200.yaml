nurec_cicd_amo_cle:
  enabled: true

switchboard:
  connections:
    car2sim_to_nre_eval:
      with_internal_input: nre-out
    car2sim_to_shim:
      with_internal_input: nre-out
    car2sim_to_nurec_cicd_amo_cle:
      force_enable: true
      target_task: trigger-gitlab-pipeline
      replace_input_task: [reconstruction]
      with_internal_input: nre-out
    car2sim_to_nurec_cicd_amo_cle_2:
      force_enable: true
      target_task: trigger-gitlab-pipeline
      replace_input_task: [swiftstack-uploader]
      with_internal_input: swiftstack-uploader-nre
    car2sim_to_nre_eval_nvrq:
      force_enable: true
      target_task: nvrq-multiplex-ncore
      replace_input_task: [clipgt-ncore]
      with_external_wf: ${car2sim.source_wf}
      with_external_input: [sauron-ncore-export]

reconstruction_run_binary_tasks:
- nre-run
- nre-out
- render_nre
- psnr-semantic-labelmap-images
- base-pacsim-replay

swiftstack_version_suffix: '$WORKFLOW_NAME'
swiftstack_version_suffix_tasks:
  - swiftstack-mount-nre
  - swiftstack-uploader-nre
