# @package _global_

defaults:
  - ndas_workflow_base
  - _self_

workflow_name_prefix: nurec-cicd-reconstruct-nrm

car2sim:
  training_config: configs/experimental/nrm_init/car2sim_6cam_nrm.yaml
  reconstruction_args:
    - --config-name=configs/experimental/nrm_init/car2sim_6cam_nrm.yaml
    - out_dir=$WORK_RECONSTRUCTION_DIR
    - mode=train
    - logger.name=dummy
    - dataset.path=$DATASET_FILE
    - dataset.seek_offset_sec=0.0
    - dataset.duration_sec=$DURATION
    - dataset.aux_data=True
    - dataset.lidar_ids=$LIDAR_ID_LIST
    - dataset.samplers.batch_sampler.camera_pixel_sampler.subsample=2
    - dataset.cuboid_tracks_params.track_label_sources=[AUTOLABEL]
    - model.layers.background.initialization.path=$NEW_INPUT/$SEQUENCE_ID.ply
    - model.layers.background.initialization.num_point_cloud_points=1000000
    - model.layers.road.initialization.path=$NEW_INPUT/$SEQUENCE_ID.ply
    - model.layers.road.initialization.num_point_cloud_points=400000

switchboard:
  connections:
    nrm_volume_to_car2sim:
      force_enable: false
      target_task: reconstruction
      add_external_inputs:
        - url: swift://pdx.s8k.io/team-ncore/nrm-init/2026-01-23_15-47-00_ee484b994
          storageSecret: team-ncore-s3
          selector: .*\/clipgt-(\w{8}-\w{4}-\w{4}-\w{4}-\w{12})\/.+ # will find all paths/files of the form */<sequence_id>/*
