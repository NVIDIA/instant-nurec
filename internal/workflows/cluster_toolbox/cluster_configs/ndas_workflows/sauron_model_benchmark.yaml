# @package _global_
#
# Sauron detection + metrics evaluation workflow.
# Composes sauron inference (sauron_detection) with metrics evaluation (sauron_metrics),
# wiring sauron-detection-tracking outputs into the metrics pipeline.
#
# Usage:
#   bazel run //internal/workflows/cluster_toolbox/ndas_workflows:run_ndas_workflow -- \
#     --ndas-workflow-config=sauron_model_benchmark.yaml \
#     docker.sauron_image=<sauron-inference-image>

defaults:
  - generic_wf_base
  - _self_

workflow_name_prefix: sauron-cicd-infer-18k

default_gpu: a100_40gb

global:
  retention:
    default: "21d"

docker:
  sauron_image: null

generic_wf_components:
  sauron_detection:
    source_wf: josliu-full-2604-sauron-detection-metrics-18kclips/latest
    cut: []
    enabled: true
    image_replacement_rules:
      - match_substrings: [sauron-inference]
        image: ${docker.sauron_image}
    # Single string: "volume:name:version" or "volume:name:version:checkpoint.ckpt"
    sauron_model: null
    # Regex string replacements applied to task scripts.
    # Each entry: {task_name: <substring>, pattern: <regex>, replacement: <string>}
    # Override from CLI: generic_wf_components.sauron_detection.string_replacements.<name>.replacement=<value>
    string_replacements:
      sauron_inference_args:
        task_name: sauron-detection-tracking
        pattern: '\$PLACEHOLDER_SAURON_ARGS'
        replacement: ''
      roi_x_min:
        task_name: 1-parquet2webdataset
        pattern: 'ROI_X_MIN=.*'
        replacement: 'ROI_X_MIN=-48'
      roi_x_max:
        task_name: 1-parquet2webdataset
        pattern: 'ROI_X_MAX=.*'
        replacement: 'ROI_X_MAX=96'
      roi_y_min:
        task_name: 1-parquet2webdataset
        pattern: 'ROI_Y_MIN=.*'
        replacement: 'ROI_Y_MIN=-48'
      roi_y_max:
        task_name: 1-parquet2webdataset
        pattern: 'ROI_Y_MAX=.*'
        replacement: 'ROI_Y_MAX=48'
