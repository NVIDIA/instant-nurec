method: grid
metric:
  goal: maximize
  name: train/psnr
parameters:
  model.acc_structure.grid_resolution:
    values: 
      - 64
      - 128
      - 256
  dataset.n_train_sample_camera_rays:
    values:
      - 2048
      - 4096
      - 8192
command:
    - /bin/bash
    - -euxc
    - |
      env

      DATASET_JSON=$(find ${WORKFLOW_INPUT} -name "*.json")

      WORKDIR=${WORKFLOW_OUTPUT}/sweep-${WANDB_SWEEP_ID}-${WANDB_RUN_ID}

      # Placeholders between << and >> are to be substituted from script.
      # Preload CUDA runtime compatibility libraries, as the old Maglev GPU drivers might not support the newer CUDA.
      #LD_PRELOAD=/usr/local/cuda/compat/libcuda.so.520.61.05:/usr/local/cuda/compat/libnvidia-nvvm.so.520.61.05:/usr/local/cuda/compat/libnvidia-ptxjitcompiler.so.520.61.05 \
      /app/run \
        --config-name=apps/AV/NV/ncore_ds_nerfacc_acc_hash_fv_sky_bckg.yaml \
        mode=train \
        dataset.path=${DATASET_JSON} \
        logger=wandb \
        logger.entity=<<wandb_entity>> \
        logger.project=<<wandb_project>> \
        logger.tags=<<wandb_tags>> \
        out_dir=${WORKDIR} \
        $0 "$@"

      ckpt=$(find ${WORKDIR} -name "last.ckpt")
      conf=$(find ${WORKDIR} -name "parsed.yaml")

      #LD_PRELOAD=/usr/local/cuda/compat/libcuda.so.520.61.05:/usr/local/cuda/compat/libnvidia-nvvm.so.520.61.05:/usr/local/cuda/compat/libnvidia-ptxjitcompiler.so.520.61.05 \
      /app/run \
        --config-name=$conf \
        mode=val \
        resume=$ckpt \
        dataset.val_camera_frame_step=30 \
        dataset.val_lidar_frame_step=30 \
        system.test.video_fps=10
    - ${args_no_hyphens}
