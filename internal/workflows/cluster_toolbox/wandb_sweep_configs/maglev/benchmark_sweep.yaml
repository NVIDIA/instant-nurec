method: grid
metric:
  goal: maximize
  name: train/psnr
parameters:
  benchmark_dataset:
    values: 
      - clip_001
      - clip_002
      - clip_003
      - clip_004
      - clip_005
      - clip_006
      - clip_007
      - clip_008
      - clip_009
      - clip_010
  benchmark_config:
    values:
      - configs/apps/AV/NV/ncore_ds_nerfacc_acc_hash_fv_sky_bckg.yaml
      - configs/apps/INGP_defaults/AV/very_big_ncore_dataloader.yaml
      - configs/apps/AV/NV/ncore_dnsg_calib_nonrigid.yaml

command:
    - /bin/bash
    - -euxc
    - |
      # $0 is "benchmark_dataset=<value>"
      # $1 is "benchmark_config=<value>"
      eval "$0"
      eval "$1"

      DATASET_DIR="${WORKFLOW_INPUT}/${benchmark_dataset}"
      echo ${DATASET_DIR}
      find ${DATASET_DIR}
      DATASET_JSON=$(find "${DATASET_DIR}" -name "*.json")
      test -n ${DATASET_JSON}

      WORKDIR=${WORKFLOW_OUTPUT}/sweep-${WANDB_SWEEP_ID}-${WANDB_RUN_ID}

      # Placeholders between << and >> are to be substituted from script.
      # Preload CUDA runtime compatibility libraries, as the old Maglev GPU drivers might not support the newer CUDA.
      # LD_PRELOAD=/usr/local/cuda/compat/libcuda.so.520.61.05:/usr/local/cuda/compat/libnvidia-nvvm.so.520.61.05:/usr/local/cuda/compat/libnvidia-ptxjitcompiler.so.520.61.05 \
      /app/run \
        --config-name=${benchmark_config} \
        mode=train \
        dataset.path=${DATASET_JSON} \
        logger=wandb \
        logger.entity=<<wandb_entity>> \
        logger.project=<<wandb_project>> \
        logger.tags=<<wandb_tags>> \
        out_dir=${WORKDIR}

      ckpt=$(find ${WORKDIR} -name "last.ckpt")
      conf=$(find ${WORKDIR} -name "parsed.yaml")

      # Preload CUDA runtime compatibility libraries, as the old Maglev GPU drivers might not support the newer CUDA.
      # LD_PRELOAD=/usr/local/cuda/compat/libcuda.so.520.61.05:/usr/local/cuda/compat/libnvidia-nvvm.so.520.61.05:/usr/local/cuda/compat/libnvidia-ptxjitcompiler.so.520.61.05 \
      /app/run \
        --config-name=$conf \
        mode=val \
        resume=$ckpt \
        dataset.val_camera_frame_step=30 \
        dataset.val_lidar_frame_step=30 \
        system.test.video_fps=10

    # Substituted by the W&B sweep controller and does not work directly inside the script above.
    - ${args_no_hyphens}
