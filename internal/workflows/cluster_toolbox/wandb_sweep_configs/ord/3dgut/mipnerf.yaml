method: grid
metric:
  goal: maximize
  name: train/psnr
parameters:
  benchmark_dataset:
    values:
      - bonsai
      - bicycle
      - counter
      - flowers
      - garden
      - kitchen
      - room
      - stump
      - treehill

  benchmark_config:
    values:
      - configs/experimental/3dgut/3dgut_colmap.yaml

command:
  - /bin/bash
  - -euxc
  - |
    # $0 is "benchmark_dataset=<value>"
    # $1 is "benchmark_config=<value>"
    eval "$0"
    eval "$1"

    data=/lustre/fsw/portfolios/nvr/projects/nvr_torontoai_3dscenerecon/users/qiwu/storage/datasets/colmap_ncore

    declare -A cameras=(  
      ["bonsai"]="camera1_2"
      ["counter"]="camera1_2"
      ["kitchen"]="camera1_2"
      ["room"]="camera1_2"
      ["bicycle"]="camera1_4"
      ["flowers"]="camera1_4"
      ["garden"]="camera1_4"
      ["stump"]="camera1_4"
      ["treehill"]="camera1_4"
    )
    camera=${cameras[${benchmark_dataset}]}

    bazel run //:run -- --config-name=${benchmark_config} mode=trainval \
      out_dir=/results/${benchmark_dataset} \
      dataset.path=${data}/${benchmark_dataset}/${benchmark_dataset}.json \
      dataset.camera_ids=[${camera}] \
      dataset.aux_data=false \
      logger=wandb \
      logger.entity=<<wandb_entity>> \
      logger.project=<<wandb_project>> \
      logger.tags=<<wandb_tags>> \
      logger.run_name=3dgut_mipnerf360_${benchmark_dataset} \
      checkpoint.artifact.enabled=false \
      checkpoint.artifact.checkpoint.enabled=false \
      checkpoint.artifact.nrend.enabled=false \
      checkpoint.artifact.rig_trajectories.enabled=false \
      checkpoint.artifact.sequence_tracks.enabled=false \
      checkpoint.every_n_train_steps=0 \
      trainer.max_epochs=1 \
      model.layers.background.particle.density_kernel_planar=false

  # Substituted by the W&B sweep controller and does not work directly inside the script above. Use "$@" to pass to script above
  - ${args_no_hyphens}
