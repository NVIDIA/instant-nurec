method: grid
metric:
  goal: maximize
  name: train/psnr
parameters:
  benchmark_dataset:
    values:
      - "10275144660749673822_5755_561_5775_561"  # 31.770 db  
      - "17761959194352517553_5448_420_5468_420"  # 32.203 db  
      - "1999080374382764042_7094_100_7114_100"   # 27.363 db   
      - "2598465433001774398_740_670_760_670"     # 33.313 db  
      - "2935377810101940676_300_000_320_000"     # 27.865 db  
      - "16646360389507147817_3320_000_3340_000"  # 31.846 db  
      - "1940032764689855266_3690_210_3710_210"   # 27.497 db  
      - "2336233899565126347_1180_000_1200_000"   # 28.260 db     
      - "2618605158242502527_1860_000_1880_000"   # N/A       
      - "4546515828974914709_922_040_942_040"     # 29.778 db  

  benchmark_config:
    values:
      - configs/apps/AV/Waymo/3dgut_static.yaml

command:
  - /bin/bash
  - -euxc
  - |
    # $0 is "benchmark_dataset=<value>"
    # $1 is "benchmark_config=<value>"
    eval "$0"
    eval "$1"

    DATA=/lustre/fsw/portfolios/nvr/users/hturki/waymo_open_dataset_v_1_4_2/v2-ncore-v3/training

    bazel run //:run -- --config-name=${benchmark_config} mode=trainval \
        dataset.path=${DATA}/${benchmark_dataset}/${benchmark_dataset}.json \
        logger.entity=<<wandb_entity>> \
        logger.project=<<wandb_project>> \
        logger.tags=<<wandb_tags>> \
        logger.run_name=3dgut_waymo_${benchmark_dataset} \
        out_dir=/results/${benchmark_dataset}

  # Substituted by the W&B sweep controller and does not work directly inside the script above. Use "$@" to pass to script above
  - ${args_no_hyphens}
