# See README.md for instructions
version: 2
schedule: '@once'
storageSecret: my-custom-swift-creds
tasks:

  # This task runs the drivesim scenario and outputs the raw data into a large zip file.
  # It uses the .sh files in a swiftstack folder to control what scenario is run, how many frames to process,
  # what sensors to use, and whether or not to enable aux data (depth, segmentation, ect)
- name: gen-headless-ds-for-ncore
  image: nvcr.io/nv-drive-internal/driveconst-qa/drivesim-ov:drivesim-ov2-develop-internal-latest
  command: /bin/bash
  inputs:
  # Modify the url and path to match your username & task folder
  - url: swift://pbss.s8k.io/team-ct-omni-syntheticdata/mshelley/ds2ncore-tasks/example_task
    # Gather all files with the same basename but different extensions
    selector: (.+)\..+
  args:
  - -euxo
  - pipefail
  - -c
  - |-
    cd /drivesim-ov
    cp {{input}}/*.sh env-setup.sh
    source env-setup.sh
    ./generate_SDG_headless_internal.sh --allow-root $SCENARIO_PATH $NUM_FRAMES --writer="NCoreDSWriter:aux_data=True;run_id={{job_id}}" --merge-config=assets/scenarios/nre/recording.toml
    cp _build/linux-x86_64/release/extsbuild/omni.sensors.nv.common/data/lidar/Hesai_P128_V4P5_HR10.json /tmp/ncore/{{job_id}}/$LIDAR_IDS/.
    ls /tmp/ncore
    cp env-setup.sh /tmp/ncore/{{job_id}}/.
    cd /tmp/ncore
    find {{job_id}}
    tar -czf {{job_id}}.tar.gz *
    mv {{job_id}}.tar.gz {{output}}/{{job_id}}.tar.gz
  cache: disable
  jobRetries: 1
  workerPool: sdg-rno-8
  secrets:
  - name: omni-asset-auth

  # This task converts the drivesim output to the ncore format.
  # It will generate a .zarr.itar file and, if aux data is enabled, a .zarr.gt.itar file as well.
- name: ncore-data-conversion
  image: nvcr.io/nvidian/ct-toronto-ai/nre_ds_to_ncore_dev:latest
  command: /bin/bash
  inputs:
  - task: gen-headless-ds-for-ncore
    selector: (.+).tar.gz
  args:
  - -euxo
  - pipefail
  - -c
  - |-
    echo "job_id={{job_id}}"
    find {{input}}
    export EXPERIMENT_NAME=`echo {{job_id}} | xargs basename -s .tar.gz`
    echo "Experiment Name: ${EXPERIMENT_NAME}"
    cd /app/internal/scripts/ds_to_ncore
    tar -xzf {{input}}/$EXPERIMENT_NAME.tar.gz
    ls -la $EXPERIMENT_NAME
    source $EXPERIMENT_NAME/env-setup.sh
    ./ds_to_ncore_image.binary --input-dir=$EXPERIMENT_NAME --run-id=$EXPERIMENT_NAME --output-dir={{output}} --camera-ids=$CAMERA_IDS --lidar-ids=$LIDAR_IDS --n-shards=$N_SHARDS
  cache: disable
  workerPool: sdg-rno-8

  # This task generates the meta data (.json) file for the ncore dataset.
- name: ds2ncore-meta
  image: nvcr.io/nv-maglev/dlav/ncore:ncore-chunk-prod
  command: /bin/bash
  inputs:
  - task: ncore-data-conversion
    selector: (.+)_.*-.*.zarr.itar
  selectorMode: intersection
  args:
  - -euxo
  - pipefail
  - -c
  - |-
    find {{input}}
    export EXPERIMENT_NAME=`echo {{job_id}} | xargs basename -s .zarr.itar`
    echo "Experiment Name: ${EXPERIMENT_NAME}"
    /app/internal/internal/scripts/ncore_chunk_image.binary.runfiles/ncore_repo/internal/scripts/ncore_sequence_meta \
    --shard-file-pattern={{input}}/$EXPERIMENT_NAME  \
    --output-dir={{output}}
  cache: disable
  workerPool: standard-worker-pool

  # This task generates the aux data shards for the dataset.
- name: nerf-aux-data
  image: nvcr.io/nvidian/ct-toronto-ai/nre_tools:latest
  command: /bin/bash
  inputs:
  - task: ncore-data-conversion
    selector: (.+).zarr.itar
  # This task is the slowest (besides maybe the drivesim task). Disable it if you don't need it.
  # If you disable it, remember to remove it from the inputs in the merge-results task below.
  args:
  - -euxo
  - pipefail
  - -c
  - |-
    nvidia-smi -q
    echo {{job_id}}
    find {{input}}
    export EXPERIMENT_NAME=`echo {{job_id}} | xargs basename -s .zarr.itar`
    echo "Experiment Name: ${EXPERIMENT_NAME}"
    /app/apps/nre_tools_image.binary ncore-aux-data \
      --shard-file-pattern="{{input}}/$EXPERIMENT_NAME.zarr.itar" \
      --output-dir={{output}}
  workerPool: sdg-rno-1

  # This task takes all the outputs from the above tasks and merges them, so it is easier to find the results all in one place.
  # All the results are uploaded to swiftstack
- name: merge-results
  image: nvcr.io/nv-maglev/ubuntu:20.04
  command: /bin/bash
  inputs:
  - task: ncore-data-conversion
    selector: (.+)_.*-.*.zarr.itar
  - task: ds2ncore-meta
    selector: (.+).json
  - task: nerf-aux-data
    selector: (.+)_.*-.*.aux.*
  selectorMode: intersection
  args:
  - -euxo
  - pipefail
  - -c
  - |-
    echo {{job_id}}
    find {{input}}
    export EXPERIMENT_NAME=`echo {{job_id}} | xargs basename -s .zarr.itar`
    echo "Experiment Name: ${EXPERIMENT_NAME}"
    export OUTPUT_DIR={{output}}/{{job_id}}
    mkdir -p $OUTPUT_DIR
    cp -r {{input}}/* $OUTPUT_DIR/.
  cache: disable
  workerPool: standard-worker-pool
  outputs:
  - url: swift://pbss.s8k.io/team-ct-omni-syntheticdata/mshelley
    path: maglev-workflows

workerPools:
- name: sdg-rno-8
  workers: 1
  cpu: "12"
  gpu: "8"
  mem: 128Gi
  disk: 512Gi
  resourceShare: sdg-rno
  nodeConstraints:
    required:
      nodeType: constellation-v2-ovx
- name: sdg-rno-1
  workers: 1
  cpu: "8"
  gpu: "1"
  mem: 64G
  disk: 64Gi
  resourceShare: sdg-rno
  nodeConstraints:
    required:
      nodeType: constellation-v2-ovx
- name: standard-worker-pool
  resourceShare: genpop
tags:
  cost-center: ct_toronto_ai

retentionPolicy:
  default: 30d
