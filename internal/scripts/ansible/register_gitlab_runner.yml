---
- name: Check if runner is in config
  shell: grep -F 'name = "{{ runner_config_name }}"' /etc/gitlab-runner/config.toml
  register: runner_in_config
  changed_when: false
  failed_when: false

- name: Check permissions before creating runner
  delegate_to: localhost
  become: no
  block:
    - name: Get current GitLab user
      uri:
        url: "{{ gitlab_url }}/api/v4/user"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_token }}"
        validate_certs: yes
      register: gitlab_user

    # Groups: GET /groups/:id/members/:user_id (direct member only). Projects: GET /projects/:id/members/all?user_ids[]= (includes inherited).
    - name: Get current user's {{ resource_type }} membership
      uri:
        url: "{{ (gitlab_url + '/api/v4/groups/' + resource_id | string + '/members/' + gitlab_user.json.id | string) if resource_type == 'group' else (gitlab_url + '/api/v4/projects/' + resource_id | string + '/members/all?user_ids[]=' + gitlab_user.json.id | string) }}"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_token }}"
        validate_certs: yes
        status_code: [200, 404]
      register: gitlab_membership

    - name: Fail if insufficient GitLab permission
      fail:
        msg: "{{ fail_msg }}"
      when: >
        (resource_type == 'group' and (gitlab_membership.status == 404 or (gitlab_membership.status == 200 and gitlab_membership.json.access_level < min_access_level))) or
        (resource_type == 'project' and ((gitlab_membership.json | default([]) | length == 0) or (gitlab_membership.json[0].access_level < min_access_level)))
  when: runner_in_config.rc != 0

- name: Create and configure runner via API
  delegate_to: localhost
  become: no
  block:
    - name: Create runner via API
      uri:
        url: "{{ gitlab_url }}/api/v4/user/runners"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ gitlab_token }}"
        body_format: form-urlencoded
        body: "{{ api_body }}"
        validate_certs: yes
      register: runner_creation
      when: runner_in_config.rc != 0
      retries: 3
      delay: 5
      until: runner_creation.status is defined and runner_creation.status in [200, 201]
      failed_when: runner_creation.status is not defined or runner_creation.status not in [200, 201]

    - name: Set runner token from API response
      set_fact:
        runner_authentication_token: "{{ runner_creation.json.token }}"
      when: >
        runner_creation is defined and
        runner_creation.json is defined and
        runner_creation.json.token is defined

- name: Register runner
  shell: |
    gitlab-runner register \
    {% if config_path | default('') %}--config {{ config_path }} \
    {% endif %}--non-interactive \
    --name "{{ runner_config_name }}" \
    --url "{{ gitlab_url }}" \
    --token "{{ runner_authentication_token }}" \
    --executor "{{ gitlab_runner_executor }}" \
    --docker-image "{{ gitlab_runner_docker_image }}" \
    --docker-privileged=true \
    --docker-volumes "/certs/client:/certs/client:ro" \
    --docker-volumes "/cache" \
    --docker-volumes "/var/run/docker.sock:/var/run/docker.sock" \
    {% if extra_docker_volumes | default('') %}{{ extra_docker_volumes }} \
    {% endif %}--docker-shm-size "{{ docker_shm_size | default('2000000000') }}" \
    --docker-gpus "all"
  when: >
    runner_in_config.rc != 0 and
    runner_authentication_token is defined and
    runner_authentication_token | length > 0
