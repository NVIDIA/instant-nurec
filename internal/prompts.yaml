20260429: """"
/plan We have to build up this codebase from scratch. A new NRM model called Kelvin landed on main in @/storage/projects/nre, however it only works when using the branch nrm/adaptive-sequential-sampler. You can see how it is being called in @nre_example_call.sh, once with merge, once
without merge. The output of this call are a bunch of directories, but for you the only important files are the ply files. I created them for you as a baseline reference for merge case and no_merge case in /storage/results/instant-nurec/baseline_ga/, ie I ran the script while being
 on the brach nrm/adaptive-sequential-sampler via /storage/projects/instant-nurec/nre_example_call.sh /storage/results/instant-nurec/baseline_ga/. Your task it to look at the Kelvin model that is being invoked in my script and port all of it over to this code base as is. Only the model that is being invoked with my script must be supported. Also please use torch's save routine to save the entire model, not only the state_dict, see here:
https://docs.pytorch.org/tutorials/beginner/saving_loading_models.html#save-load-entire-model. I think with this we should be able to save several thousand lines of code. Once you ported the model over to this codebase, write unit tests for each function and each function's code path to ensure everything works as expected. The
final call to run predict mode from within this repository should be small and consice and only depend on the dataset path, the merge strategy (defaule none), the output-dir, and a log-level from logging (defaulting to info level), as only one model is supported. Something like
run.py --ncore-path path/to/ncorev4/directory --output-dir path/to/output --merge [none,frustum-ownership] --log-level INFO|DEBUG|... Once you ported everything over and unit tests succeed and the CLI is set up, run it with the dataset in /storage/data/nurec/ncorev4. This will be
an iterative process as stated in the @CLAUDE.md file: 1. run the command, let it timeout after 60s if no output is being logged in the command line. 2a. if it times out, add logging to see what is going on. 2b. If it doesn't time out and fails, look at the error. Look how it's handled in the
/storage/project/nre repo and fix it accorindgly. If the fix is not applicable, come upt with your own fix, but keep it minimal and your own fix should really only be the last resort. Go back to 1 and re-run. Do this until ply files are being generated for both, the merge and the
no_merge case. At this stage, the next iterative process starts: 1. Run the two commands, ie merge and no-merge. 2. Compare the ply files of your run with the reference ply files living in /storage/results/instant-nurec/baseline_ga/. Comparison should be done in the following
manner: The files to be compared are the ply file of the merge case, with the reference ply file of the merge case and the ply files of the no-merge with the reference ply files of the no-merge case. 2a initial comparison can be a number of files comparison, both approaches should
create the same number of ply files, ie merge should create 1 ply file, no-merge should create <number_of_chunks> ply files, in the case of the dataset we're using it's two ply files. If the number of output files is different, it's a bug. Look at how it's done in the nre repo and
fix it, then go back to 1. If the same number of files, go to the next step. 2b The corresponding files should be roughly the same filesize, ie. ~113M and ~94M in the no-merge case and ~187M in the merge case. If the size is largely different, it's a bug. Look how it's done in the
nre repo and fix it, then go back to 1. If it's roughly the same file size go to the next step. 2c Write a python script that load the ply files that should be compared, ie. it should run three comparisons (one comp. on the single ply file in the merge case with the respective
baseline, and two comps. with the two ply files of the no-merge case with their respective baselines). The python script should validate the following: The attributes of the ply files should have the same custom attributes present, they should also be equal in size and they should
not differ per element more than 1e-3, ie something like ((ply.custom_attribute - ply_baseline.custom_attribute).abs()<1e-3).all() for all positions and all custom attributes. If there's a difference in the available custom attributes or any tensor size/shape, it's a bug. Look at
how it's done in the nre repo and fix it, go back to 1. If the per element error is >1e-3, it's a bug. Look at how it's done in the nre repo and fix it, go back to 1. If it's smaller than 1e-3, your successfull and you can stop iterating. The constraints are: 1. Port the minimal
number of lines from the nre repo and only what is needed by nrm/instant-nurec. 2. Don't depend on the nre repo, be standalone. 3. Have a similar repo structure as https://github.com/NVIDIA/asset-harvester. 4. Do not use bazel. 5. Build tests for each function's code path. 6. Save and load the
 full model, not only the state_dict, see https://docs.pytorch.org/tutorials/beginner/saving_loading_models.html#save-load-entire-model. 7. Create a new branch in this repo and create 1 commit after you copied the new model if all tests
being successful and afterwards, once you start your two iterative cycles, create one commit for each failed and fixed bug to see your history. 8. After you were succesful, create the final/last commit. 9. keep the same constraints as the plan
@docs/plans/001-nrm-predict-extraction.md. 10. Only look at the nrm/adaptive-sequential-sampler branch in the nre repo as a code reference, don't change branches. 11. Use the script @nre_example_call.sh to infer the necessary code paths in nre. 12. only use the ply files I provided
 as reference baseline +  the corresponding parsed.yaml file in the same output directory.

AFter you copied the code as is, verify the following is correct. It needs to be a perfect parity.
