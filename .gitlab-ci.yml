# Minimal CI for the standalone instant_nurec repo.
#
# `lint` runs first and gates `test`: a ruff failure is cheap to surface,
# and there's no point spinning up the slower pytest job until style is
# clean. Both stages build the same locked environment contributors get
# from ``./setup.sh`` (``uv sync --frozen``), so a green pipeline matches
# a green local run.
#
# End-to-end inference and parity-style verification need a GPU and are
# intentionally not part of this pipeline (see CLAUDE.md rule 4).

# Run on every merge request, and on pushes to ``main``. A push to a
# feature branch with an MR open produces a single MR pipeline (no
# duplicate branch pipeline), since the ``push`` source doesn't match
# either rule.
workflow:
  auto_cancel:
    # When a new commit lands on the same ref, cancel any still-running
    # pipeline on the previous SHA. Jobs opt in via ``interruptible: true``.
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    # Release branches follow ``release/YY.MM`` (e.g. ``release/26.06``).
    # Treat them like ``main`` for now — every push runs the pipeline.
    - if: $CI_COMMIT_BRANCH =~ /^release\/[0-9]{2}\.(0[1-9]|1[0-2])$/

stages:
  - lint
  - test

default:
  image: python:3.11-slim
  # Pick up the ``nrs`` group's shared docker runners. The project has no
  # project-level runners, so without these tags GitLab reports "no runner".
  # GPU tags (``gpu``/``2_gpus``) are intentionally omitted — lint and the
  # CPU pytest suite don't need a GPU, and asking for one would queue these
  # jobs behind much scarcer hardware.
  tags:
    - type/docker
    - os/linux
    - arch/x86_64
  # Both jobs are pure read-only checks — safe to cancel mid-run when a
  # newer commit supersedes them.
  interruptible: true
  before_script:
    - pip install --no-cache-dir uv==0.4.30
    - uv sync --frozen

ruff:
  stage: lint
  script:
    - .venv/bin/ruff check .

no-fixups:
  # Refuse to merge MRs that still carry ``fixup!`` / ``squash!`` commits;
  # those are placeholders for ``git rebase -i --autosquash`` and aren't
  # meant to land in main's history. Only runs on MR pipelines — on
  # protected branches the commits are already final, and there's no
  # diff base to compare against.
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # ``alpine/git`` ships git directly, so we skip the default
  # python/uv setup and keep this job a few seconds wall-clock.
  # Its entrypoint is ``git``; override to empty so GitLab's
  # ``sh -c "<script>"`` step runner isn't passed as a git
  # subcommand (``git sh ...`` → ``git: 'sh' is not a git command``).
  image:
    name: alpine/git
    entrypoint: [""]
  variables:
    # MR pipelines default to a shallow clone; force full history so
    # ``$CI_MERGE_REQUEST_DIFF_BASE_SHA`` is always reachable.
    GIT_DEPTH: "0"
  before_script: []
  # Each step is a single line so GitLab's job log echoes them all
  # — a ``- |`` block collapses to just the first line in the UI.
  script:
    - range="$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"
    - bad=$(git log --format='%h %s' "$range" | grep -E '^[0-9a-f]+ (fixup|squash)!' || true)
    - if [ -z "$bad" ]; then echo "OK — no fixup/squash commits in $range"; exit 0; fi
    - echo "Refusing to merge — fixup/squash commits present in MR:"
    - echo "$bad"
    - 'echo "Run: git rebase -i --autosquash $CI_MERGE_REQUEST_DIFF_BASE_SHA"'
    - exit 1

pytest:
  stage: test
  # Decouple pytest from the rest of ``lint`` via the DAG: a
  # ``no-fixups`` failure is purely commit-message housekeeping and
  # shouldn't suppress test signal. The pipeline still fails red
  # overall; pytest just runs in parallel with ``no-fixups``.
  needs:
    - ruff
  # Only the test job needs a C++ toolchain: Torch Inductor's CPU backend
  # JITs a vector-ISA probe via ``g++`` the first time any
  # ``@torch.compile``-decorated function runs on CPU (e.g.
  # ``unproject_to_sky_cubemap`` in tests/test_cubemap.py). The lint job
  # doesn't import torch, so we don't pay the ~50s install there.
  # ``!reference`` splices in the default ``before_script`` so we don't
  # have to duplicate the uv steps.
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends g++
    - !reference [default, before_script]
  script:
    - .venv/bin/python -m pytest tests/ -q
