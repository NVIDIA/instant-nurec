[project]
name = "instant_nurec"
version = "0.1.0"
description = "Standalone NRM Kelvin predict pipeline (NRMConfig → ncorev4 ingest → Kelvin predict → 3D-Gaussian PLY export)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "einops",
    "numpy",
    "nvidia-ncore",
    "pandas",
    "pillow",
    "plyfile",
    "point-cloud-utils",
    "pydantic",
    "pyyaml",
    "scipy",
    "shortuuid",
    # torch pinned to match the NRE-internal bazel build (NRE@a54a6af pinned
    # ``torch==2.7.0+cu128.gitc41f6e01287`` via the internal index;
    # ``2.7.0+cu128`` is the closest publicly-installable equivalent). Pinning
    # here keeps the parity drift attributable to a known torch+CUDA version
    # rather than whichever wheel happens to be the latest. Update the pin
    # only deliberately, with a re-parity sweep.
    "torch==2.7.0+cu128",
    "tqdm",
    "universal-pathlib",
    "zarr",
]

[project.scripts]
instant-nurec = "instant_nurec.cli:main"

[tool.setuptools.packages.find]
include = ["instant_nurec*"]
exclude = ["tests*", "baselines*", "internal*", "benchmark*"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    # Prevent checking ci-cache files
    ".ci-keep",
]

[tool.ruff.lint.isort]
known-first-party = ["instant_nurec", "benchmark", "ncore"]
default-section = "third-party"
known-third-party = ["wandb"] # prevent local wandb folders to be treaded as different package - see https://github.com/astral-sh/ruff/issues/8571
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-between-types = 1
lines-after-imports = 2

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
