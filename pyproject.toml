[project]
name = "instant_nurec"
version = "0.1.0"
description = "Standalone InstantNuRec Kelvin predict pipeline (ncorev4 ingest → Kelvin predict → 3D-Gaussian PLY export)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # All version pins below match what the NRE bazel build at commit
    # a54a6af resolves out of its internal index. Carrying those exact
    # versions over here means any parity / runtime drift is attributable
    # to a deliberate dep bump rather than to whichever wheel happens to
    # be the latest at install time. Update a pin only with a re-parity
    # sweep against ``baselines/original_baseline``.
    "einops==0.8.1",
    "numpy==1.26.4",
    "nvidia-ncore==18.7.0",
    "pandas==2.3.3",
    "pillow==12.1.1",
    # plyfile is the only dep not pinned by the NRE build (NRE itself does
    # not depend on it; it's used here by ``benchmark/validate_parity.py``
    # and ``predict/export_ply.py`` for the standalone PLY round-trip).
    # Pin to the version this branch was developed + tested against.
    "plyfile==1.1.3",
    "point-cloud-utils==0.34.0",
    "pydantic==2.8.2",
    "pyyaml==6.0",
    "scipy==1.11.1",
    "shortuuid==1.0.11",
    # torch pinned to match the NRE-internal bazel build (NRE@a54a6af pinned
    # ``torch==2.7.0+cu128.gitc41f6e01287`` via the internal index;
    # ``2.7.0+cu128`` is the closest publicly-installable equivalent).
    "torch==2.7.0+cu128",
    "tqdm==4.66.3",
    "universal-pathlib==0.3.6",
    "zarr==2.18.2",
]

[project.scripts]
instant-nurec = "instant_nurec.cli:main"

[tool.setuptools.packages.find]
include = ["instant_nurec*"]
exclude = ["tests*", "baselines*", "internal*", "benchmark*"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    # Prevent checking ci-cache files
    ".ci-keep",
]

[tool.ruff.lint.per-file-ignores]
# Tests + run_inference.py prepend the repo root to sys.path before importing
# in-tree modules; ruff's E402 (module-level import not at top of file) flags
# the legitimate ordering.
"tests/*.py" = ["E402"]
"run_inference.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["instant_nurec", "benchmark", "ncore"]
default-section = "third-party"
known-third-party = ["wandb"] # prevent local wandb folders to be treaded as different package - see https://github.com/astral-sh/ruff/issues/8571
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-between-types = 1
lines-after-imports = 2

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
