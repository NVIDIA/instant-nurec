# @package _global_

# order in which configs override each other (/* - denotes a relative search path)
defaults:
  - /apps/prod/Hyperion-8.1/car2sim
  - /model/gaussians/models@model.layers.loaded_ply_assets: deformable_rigid_asset_model
  - /model/gaussians/initialization@model.layers.loaded_ply_assets.initialization: ply_tracks
  - /model/tracks_calib@model.layers.loaded_ply_assets.tracks_calib: direct
  - /model/gaussians/extra_signal@model.layers.loaded_ply_assets.extra_signal: [semantic_logits]
  - /model/gaussians/models@model.layers.loaded_ply_assets_no_optim: rigid_gaussians
  - /model/gaussians/initialization@model.layers.loaded_ply_assets_no_optim.initialization: ply_tracks
  - /model/tracks_calib@model.layers.loaded_ply_assets_no_optim.tracks_calib: direct
  - /model/gaussians/extra_signal@model.layers.loaded_ply_assets_no_optim.extra_signal: [semantic_logits]
  - override /difix: difix

model:
  layers:
    loaded_ply_assets:
      # All defaults (name, optimizers, schedulers, etc.) come from deformable_rigid_asset_model.yaml
      # Only override the tracks configuration here
      tracks:
        ids: []
        is_dynamic: true
      initialization:
        track_ids: {}

    loaded_ply_assets_no_optim:
      fourier_features_dim: 20
      time_embed:
        name: individual-remap-time-input-embedding
        remap_min: 0
        remap_max: 1
      particle:
        density_kernel_degree: 2
        density_kernel_min_response: 0
      tracks:
        ids: []
        is_dynamic: true
      initialization:
        track_ids: {}
      optimizers:
      - name: fused_adam
        args:
          lr: 0
          eps: 1.0e-15
          betas:
          - 0.9
          - 0.99
        params:
          positions:
            args:
              lr: 0
      - name: fused_adam
        args:
          lr: 0
          eps: 1.0e-15
          betas:
          - 0.9
          - 0.99
        params:
          densities:
            args:
              lr: 0
          features_albedo:
            args:
              lr: 0
          features_specular:
            args:
              lr: 0
          rotations:
            args:
              lr: 0
          scales:
            args:
              lr: 0
          extra_signal:
            args:
              lr: 0

    dynamic_rigids:
      tracks:
        is_dynamic: true
        exclude_ids: []
  strategy:
    exclude_layer_ids:
      - loaded_ply_assets
      - loaded_ply_assets_no_optim


