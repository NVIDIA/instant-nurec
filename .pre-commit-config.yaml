repos:
  - repo: local
    hooks:
      - id: bazel-format
        name: bazel-format
        entry: bazel run //:format
        language: system
        pass_filenames: false
        types_or: [python, c++, c, cuda, markdown, bazel]
      - id: bazel-format.check
        name: bazel-format.check
        entry: bazel run //:format.check
        language: system
        pass_filenames: false
        types_or: [bazel]
