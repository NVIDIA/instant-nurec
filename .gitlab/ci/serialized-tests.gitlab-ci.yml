# Nightly job that runs the default set of tests and sqa_lite with no Bazel parallelism, to measure per-target runtimes
# for the CI visualization dashboard.
#  - Test results are cached under a separate key (--test_env=SERIALIZED_TESTS_JOB=1) so they do not mix with the usual,
#    parallelized test runs.
#  - We do not empty non-Bazel local test caches, so runtimes measured by this job will reflect typical usage patterns
#    rather than worst case and could exhibit some variation from run to run, especially for MyPy
serialized_tests:
  extends: .bazel_test
  stage: benchmark
  needs:
    - build+test
  tags:
    - type/docker
    - os/linux
    - arch/x86_64
    - gpu
    - 2_gpus
  script:
    # Build all in parallel; then run tests with --jobs=1 so only test execution is serial.
    - bazelisk build ...
    - bazelisk test ... --jobs=1 --test_env=SERIALIZED_TESTS_JOB=1
    - bazelisk test //internal/sqa:sqa_test_suite --jobs=1 --test_env=SERIALIZED_TESTS_JOB=1
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "nightly"
      when: on_success
    - when: manual
  allow_failure: true
