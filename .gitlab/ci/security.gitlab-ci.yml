include:
  - project: pstooling/gitlab-templates
    ref: main
    file:
      - /templates/pulse-trufflehog/Base.gitlab-ci.yml
      - /templates/pulse-in-pipeline/ContainerScanImage.gitlab-ci.yml

.container-scan-base:
  needs:
    - images
  stage: security
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "nightly"
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ /^release\/[0-9]{2}\.(0[1-9]|1[0-2])$/
      when: on_success
    # Run on tag creation: YY.MM-rcN (25.08-rc1, 25.11-rc10, etc.)
    - if: $CI_COMMIT_TAG =~ /^[0-9]{2}\.(0[1-9]|1[0-2])-rc[1-9][0-9]*$/
      when: on_success

fetch-secrets:
  extends: .container-scan-base
  id_tokens:
    VAULT_JWT_TOKEN:
      aud: $VAULT_SERVER_URL
  script: 
    - echo "Fetching secrets using Vault agent"
    - vault agent -config=.gitlab/ci/vault/vault-agent.config -exit-after-auth
    - echo "SSA_CLIENT_ID, SSA_CLIENT_SECRET fetched successfully"
  artifacts:
    reports:
      dotenv: my_secret.env
    expire_in: 5 minutes

container-secret-scan:
  extends: .container-scan-base
  image:
    name: gitlab-master.nvidia.com:5005/pstooling/pulse-group/pulse-secret-scanner:$PULSE_TRUFFLEHOG_IMAGE_TAG
    entrypoint: ["bash", "-l", "-c"]
  before_script:
    - export TRUFFLEHOG_NGC_API_KEY=${NGC_API_KEY}
    - !reference [.container-pulse-secret-scan, before_script]
  script:
    - export VERSION_STRING=$(bazel/version/version_string.sh)
    - !reference [.pulse-th-framework, cpu]
    - !reference [.pulse-th-framework, handle_exclude_detectors]
    - echo "Using pulse-secret-scanner docker API"
    - !reference [.pulse-th-framework, docker_auth]
    - internal/scripts/ci/secret_scan.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ./.pulse-secret-scan/

container-oss-scan:
  extends: .container-scan-base
  needs:
    - fetch-secrets  # SSA_CLIENT_ID/SSA_CLIENT_SECRET auto-loaded from dotenv artifact
  image:
    gitlab-master.nvidia.com:5005/pstooling/pulse-group/pulse-container-scanner/pulse-cli:$CONTAINER_SCAN_CLI_VERSION
  before_script: []  # Skip default before_script (nvidia-smi not available in this image)
  script:
    - export PRODSEC_TEMPLATE_ID=ContainerScanByTag.gitlab-ci.yml && export BASE_TEMPLATE_NAME=.scan-image-with-policy
    - export CI_REGISTRY_PASSWORD=${NGC_API_KEY}
    - export CI_REGISTRY_USER='$oauthtoken'
    - export CI_REGISTRY=${DEPLOY_REGISTRY}
    - export GOVREADY=false
    - !reference [.track_template_usage, script]
    - !reference [.scan_script, docker_auth]
    - !reference [.scan_script, validate_requirements]
    - !reference [.scan_script, get_ssa_token]
    - !reference [.scan_script, cpu]
    - export VERSION_STRING=$(bazel/version/version_string.sh)
    - echo "Using $CONTAINER_SCAN_HELPER_VERSION of the container scan helper."
    - internal/scripts/ci/oss_scan.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - oss_scan_artifacts
  allow_failure: true # Don't block the pipeline - these will notify the right people if a vulnerability is found.
