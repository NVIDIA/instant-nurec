pages:
  stage: deploy
  script:
    # Build the HTML documentation
    - bazelisk clean
    - bazelisk build //docs:nre

    # Move it to the output artifact for upload (requires root right to write)
    - sudo mv bazel-bin/docs/nre_html/ public/

    # Deploy the latest coverage report
    # This is designed to cope with possible failure of the coverage job,
    # which is optional prior to merge, and always deploy the latest available
    # coverage data for the main branch, even if it was generated by an older
    # pipeline.
    # TODO We should be able to simplify this by moving coverage handling into a
    # separate job once parallel deployments and user-defined job names are
    # supported by our Gitlab instance (version 17.5+).

    # If the coverage job did not run or failed in the current pipeline,
    # download and extract artifacts from the latest successful pipeline on main
    # branch.
    - |
      if [ ! -d coverage ]; then
        curl -s --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -o coverage.zip "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_DEFAULT_BRANCH}/download?job=coverage"
        unzip -q -o coverage.zip
        echo "Coverage report not found in this pipeline, downloaded from the latest passing pipeline on main branch"
      fi
    # Move into subfolder of the output artifact
    - sudo mv coverage public/

    # Similarly deploy the latest available CI analytics data
    - |
      if [ ! -d ci_analytics ]; then
        curl -s --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -o ci_analytics.zip "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_DEFAULT_BRANCH}/download?job=ci_analytics"
        unzip -q -o ci_analytics.zip
        echo "CI analytics data not found in this pipeline, downloaded from the latest passing pipeline on main branch"
      fi
    - sudo mv ci_analytics public/
  artifacts:
    paths:
      - bazel-telemetry/
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
