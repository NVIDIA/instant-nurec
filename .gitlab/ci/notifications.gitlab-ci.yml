.notification_slack:
  stage: .post

notify_weekly_build_success:
  extends: .notification_slack
  needs:
    - images
  script:
    # For Slack
    - |
      curl -X POST \
      --data-urlencode "payload={\"channel\": \"#swdl-nre-sqa\", \"username\": \"GitLab Weekly Webhook\", \"icon_emoji\": \":gitlab:\", \"text\": \"✅ Weekly NRE Image Build Success!\nPipeline: ${CI_PIPELINE_URL}\nProject: ${CI_PROJECT_NAME}\nBranch: ${CI_COMMIT_BRANCH}\nCommit: ${CI_COMMIT_SHORT_SHA} - ${CI_COMMIT_TITLE}\nImage tag: ${VERSION_STRING}\"}" \
      ${SLACK_WEBHOOK_URL}

  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "weekly_monday"
      when: on_success

notify_weekly_build_failure:
  extends: .notification_slack
  needs:
    - job: images
      optional: true
  script:
    # For Slack
    - |
      curl -X POST \
      --data-urlencode "payload={\"channel\": \"#swdl-nre-sqa\", \"username\": \"GitLab Weekly Webhook\", \"icon_emoji\": \":gitlab:\", \"text\": \"❌ Weekly NRE Image Build Failed!\nPipeline: ${CI_PIPELINE_URL}\nProject: ${CI_PROJECT_NAME}\nBranch: ${CI_COMMIT_BRANCH}\nCommit: ${CI_COMMIT_SHORT_SHA} - ${CI_COMMIT_TITLE}\"}" \
      ${SLACK_WEBHOOK_URL}

  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "weekly_monday"
      when: on_failure

notify_release_candidate_tag:
  extends: .notification_slack
  needs:
    - job: images
  script:
    - IMAGE="${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_run:${VERSION_STRING}"
    # Verify image exists
    - docker manifest inspect ${IMAGE} > /dev/null || (echo "Image ${IMAGE} not found" && exit 1)
    - |
      curl -X POST \
      --data-urlencode "payload={\"channel\": \"#nre-release-coordination\", \"username\": \"GitLab RC Bot\", \"icon_emoji\": \":gitlab:\", \"text\": \":checkered_flag: New Release Candidate Ready\\nTag: \`${CI_COMMIT_TAG}\`\\nImages:\\n  - \`${IMAGE}\`\\n  - \`${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_tools:${VERSION_STRING}\`\\n  - \`${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_obfuscated_run:${VERSION_STRING}\`\\n  - \`${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_obfuscated_tools:${VERSION_STRING}\`\\nPipeline: ${CI_PIPELINE_URL}\"}" \
      ${SLACK_WEBHOOK_URL}
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]{2}\.(0[1-9]|1[0-2])-rc[1-9][0-9]*$/ && $CI_PIPELINE_SOURCE == "push"
    