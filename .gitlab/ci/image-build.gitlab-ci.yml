# Base image template for all images
.images_base:
  stage: deploy

########################################################
# Main images
########################################################

images:
  extends: .images_base
  script:
    # When adding images here, please also update CONTAINER_IMAGE_SUFFIXES in internal/scripts/ci/analytics/ci_job_collector.py
    # to make it collect their size history.
    - |
      [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]] && LATEST_TAG="--tag latest" || LATEST_TAG=""
    - bazelisk run //:push_run_image_oci -- --repository ${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_run --tag ${VERSION_STRING} ${LATEST_TAG}
    - bazelisk run //apps:push_nre_tools_image_oci -- --repository ${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_tools --tag ${VERSION_STRING} ${LATEST_TAG}
    - bazelisk run //nre/nrm:push_nrm_run_image_oci -- --repository ${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_nrm_run --tag ${VERSION_STRING} ${LATEST_TAG}
    - bazelisk run --config=no-internal //:push_obfuscated_run_image_oci -- --repository ${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_obfuscated_run --tag ${VERSION_STRING} ${LATEST_TAG}
    - bazelisk run --config=no-internal //apps:push_obfuscated_nre_tools_image_oci -- --repository ${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_obfuscated_tools --tag ${VERSION_STRING} ${LATEST_TAG}
    - bazelisk run --config=no-internal //nre/nrm:push_obfuscated_nrm_run_image_oci -- --repository ${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_obfuscated_nrm_run --tag ${VERSION_STRING} ${LATEST_TAG}
    - |
      IMAGES="${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_run:${VERSION_STRING}"
      IMAGES="${IMAGES},${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_tools:${VERSION_STRING}"
      IMAGES="${IMAGES},${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_nrm_run:${VERSION_STRING}"
      IMAGES="${IMAGES},${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_obfuscated_run:${VERSION_STRING}"
      IMAGES="${IMAGES},${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_obfuscated_tools:${VERSION_STRING}"
      IMAGES="${IMAGES},${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_obfuscated_nrm_run:${VERSION_STRING}"
      internal/scripts/ci/image_analysis/registry_image_sizes.py --images "$IMAGES"
  rules:
    # Run on nightly schedule
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "nightly"
      when: on_success
    # Run on each merge to main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    # Run on release branches (release/YY.MM)
    - if: $CI_COMMIT_BRANCH =~ /^release\/[0-9]{2}\.(0[1-9]|1[0-2])/
      when: on_success
    # Run on MRs targeting release branches (release/YY.MM)
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\/[0-9]{2}\.(0[1-9]|1[0-2])/
      when: on_success
    # Run on tag creation: YY.MM-rcN (25.08-rc1, 25.11-rc10, etc.)
    - if: $CI_COMMIT_TAG =~ /^[0-9]{2}\.(0[1-9]|1[0-2])-rc[1-9][0-9]*$/
      when: on_success
    # Auto-run for MAGLEV workflows and don't mandate success
    - if: $AUTO_RUN_MAGLEV_NDAS_WORKFLOW == "true" || $AUTO_RUN_MAGLEV_NDAS_WORKFLOW_LIDARFREE == "true"
      when: on_success
      allow_failure: true
    # Otherwise allow manual trigger and don't mandate success
    - when: manual
      allow_failure: true

images_ds_to_ncore:
  extends: .images_base
  script:
    - |
      [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]] && LATEST_TAG="--tag latest" || LATEST_TAG=""
    - bazelisk run //internal/scripts/ds_to_ncore:push_ds_to_ncore_image_oci -- --repository ${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_ds_to_ncore --tag ${VERSION_STRING} ${LATEST_TAG}
    - |
      IMAGES="${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_ds_to_ncore:${VERSION_STRING}"
      internal/scripts/ci/image_analysis/registry_image_sizes.py --images "$IMAGES"
  rules:
    # This special image is built on-demand only
    - when: manual
  allow_failure: true

images_grpc:
  extends: .images_base
  script:
    - |
      [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]] && LATEST_TAG="--tag latest" || LATEST_TAG=""
    - bazelisk run --config=run_grpc_only //:push_run_image_oci -- --repository ${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_run_grpc --tag ${VERSION_STRING} ${LATEST_TAG}
    - bazelisk run --config=run_grpc_only //:push_obfuscated_run_image_oci -- --repository ${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_obfuscated_run_grpc --tag ${VERSION_STRING} ${LATEST_TAG}
    - |
      IMAGES="${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_run_grpc:${VERSION_STRING}"
      IMAGES="${IMAGES},${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_obfuscated_run_grpc:${VERSION_STRING}"
      internal/scripts/ci/image_analysis/registry_image_sizes.py --images "$IMAGES"
  rules:
    # This special image is built on-demand only
    - when: manual
  allow_failure: true

########################################################
# Release images
########################################################

# Retag images as release candidates when RC tags are created
push_nspect_release_candidates:
  extends: .images_base
  needs:
    - images
  stage: deploy
  script:
    - |
      # Extract RC number from tag (e.g., 25.10-rc1 -> 1)
      RC_NUMBER=$(echo "$CI_COMMIT_TAG" | sed 's/.*-rc\([0-9]\+\)$/\1/')

      echo "Creating release candidate RC${RC_NUMBER} from source tag: ${VERSION_STRING}"
      echo "Target RC tag: ${CI_COMMIT_TAG}"

      # Run the Python retag script with auto-confirmation
      bazelisk run //internal/scripts/release:retag-release-images -- \
        --source-tag "${VERSION_STRING}" \
        --rc-number "${RC_NUMBER}" \
        --yes
  rules:
    # Run only on RC tag creation: YY.MM-rcN (25.08-rc1, 25.11-rc10, etc.)
    - if: $CI_COMMIT_TAG =~ /^[0-9]{2}\.(0[1-9]|1[0-2])-rc[1-9][0-9]*$/ && $CI_PIPELINE_SOURCE == "push"
      when: on_success
