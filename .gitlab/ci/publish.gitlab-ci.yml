artifact_wheel:
  stage: deploy
  when: manual # Job is enabled and can be triggered manually on all pipeline types and all branches
  allow_failure: true # Optional manual job, does not block the pipeline
  script:
    - bazelisk build //nre/artifact:wheel
    - pip install twine
    # Deploy wheel, skip if version already exists
    - TWINE_USERNAME=$PYPACKAGE_LOGIN TWINE_PASSWORD=$PYPACKAGE_PASSWORD python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi bazel-bin/nre/artifact/*.whl --verbose --skip-existing --non-interactive

# Job to trigger pipeline in the external omniverse/nrend project.
# This will build the NREND package for linux and windows, and publish it to
# Omniverse Artifactory.
publish_nrend:
  stage: deploy
  when: manual
  variables:
    NRE_BRANCH: $CI_COMMIT_REF_NAME
  trigger:
    project: omniverse/nrend
    branch: main
    strategy: depend
  rules:
    # Automatically trigger on commit tags (release-YY.MM)
    - if: $CI_COMMIT_TAG =~ /^release-[0-9]{2}\.(0[1-9]|1[0-2])/ && $CI_PIPELINE_SOURCE == "push"
      when: always
    # Otherwise allow as manual job
    - if: $CI_COMMIT_BRANCH
      when: manual
