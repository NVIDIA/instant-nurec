.maglev_launch_ndas_workflow:
  stage: benchmark
  needs:
    - images
  variables:
    # These variables can be overridden manually in case of a manual job launch
    NDAS_WORKFLOW_CONFIG_ARG: ""
    NDAS_WORKFLOW_ARGS: ""
  script:
    - IMAGE="${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_run:${VERSION_STRING}"
    - TOOLS_IMAGE="${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_tools:${VERSION_STRING}"
    - NRM_IMAGE="${DEPLOY_REGISTRY}/${DEPLOY_BASE_REPOSITORY}_nrm_run:${VERSION_STRING}"
    - 'echo "Docker image to benchmark: ${IMAGE}"'
    - "WORKFLOW_CONFIG_ARG=${LIDARFREE_WORKFLOW_CONFIG_ARG:-${NDAS_WORKFLOW_CONFIG_ARG}}"
    - 'echo "Using config: ${WORKFLOW_CONFIG_ARG}"'
    - 'eval "bazelisk run //internal/workflows/cluster_toolbox/ndas_workflows:run_ndas_workflow -- --docker-image=${IMAGE}
      --tools-docker-image=${TOOLS_IMAGE} --nrm-docker-image=${NRM_IMAGE} ${WORKFLOW_CONFIG_ARG}
      ${NDAS_WORKFLOW_ARGS}"'

maglev_launch_ndas_workflow:
  extends: .maglev_launch_ndas_workflow
  rules:
    # Run on each merge to main (but not on scheduled or downstream pipelines)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "pipeline"
      when: on_success
    # Auto-run for MAGLEV workflows
    - if: $AUTO_RUN_MAGLEV_NDAS_WORKFLOW == "true"
      when: on_success
      allow_failure: true
    # Otherwise allow manual trigger
    - when: manual
      allow_failure: true

