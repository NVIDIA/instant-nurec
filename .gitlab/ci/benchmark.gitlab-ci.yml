# Standalone maglev workflow — no image build dependency.
# Can be triggered cross-project (e.g., from Sauron CI) via AUTO_RUN_STANDALONE_MAGLEV_WF.
# Note: build+test and other always-run jobs will also run in the downstream pipeline.
ndaswf_standalone:
  stage: build
  needs: []
  variables:
    NDAS_WORKFLOW_CONFIG_ARG: ""
    NDAS_WORKFLOW_ARGS: ""
    STANDALONE_NRE_DEFAULT_TAG: "26.3.78-66d2beab"
  script:
    - |
      DEFAULT_IMAGE="nvcr.io/nvidian/ct-toronto-ai/nre_run:${STANDALONE_NRE_DEFAULT_TAG}"
      DEFAULT_TOOLS_IMAGE="nvcr.io/nvidian/ct-toronto-ai/nre_tools:${STANDALONE_NRE_DEFAULT_TAG}"
      DEFAULT_NRM_IMAGE="nvcr.io/nvidian/ct-toronto-ai/nre_nrm_run:${STANDALONE_NRE_DEFAULT_TAG}"

      # Fill in default NRE images for any that aren't already specified in NDAS_WORKFLOW_ARGS
      IMAGE_ARGS=""
      if ! echo "${NDAS_WORKFLOW_ARGS}" | grep -q -- "--docker-image"; then
        IMAGE_ARGS="${IMAGE_ARGS} --docker-image=${DEFAULT_IMAGE}"
      fi
      if ! echo "${NDAS_WORKFLOW_ARGS}" | grep -q -- "--tools-docker-image"; then
        IMAGE_ARGS="${IMAGE_ARGS} --tools-docker-image=${DEFAULT_TOOLS_IMAGE}"
      fi
      if ! echo "${NDAS_WORKFLOW_ARGS}" | grep -q -- "--nrm-docker-image"; then
        IMAGE_ARGS="${IMAGE_ARGS} --nrm-docker-image=${DEFAULT_NRM_IMAGE}"
      fi
      echo "Config arg: ${NDAS_WORKFLOW_CONFIG_ARG}"
      echo "Image args: ${IMAGE_ARGS}"
      echo "Extra args: ${NDAS_WORKFLOW_ARGS}"
      eval "bazelisk run //internal/workflows/cluster_toolbox/ndas_workflows:run_ndas_workflow -- \
        ${IMAGE_ARGS} ${NDAS_WORKFLOW_CONFIG_ARG} ${NDAS_WORKFLOW_ARGS}"
  rules:
    - if: $AUTO_RUN_STANDALONE_MAGLEV_WF == "true"
      when: on_success
      allow_failure: true

