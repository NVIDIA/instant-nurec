# @package _global_
# Owner: Mu Li

# order in which configs override each other (/* - denotes a relative search path)
defaults:
  - /apps/AV/_base_3dgut_dynamic_road_semantic.yaml
  - /apps/prod/options/artifact: default
  - /apps/prod/options/nrend: disabled
  - /apps/prod/options/difix/3dgut: disabled
  - /apps/prod/options/mesh: disabled
  - /apps/prod/options/ground: disabled
  - /apps/prod/options/subsampling/3dgut: batch_sampler_4
  - /apps/prod/Hyperion-8.1/options/sensors: hyperion8.1_4cam_1lidar
  - /apps/prod/Hyperion-8.1/options/validation: default
  # Enable the calibration module to optimize per-frame poses
  - /apps/prod/options/calib: enabled
  # Enable MCMC strategy
  - /apps/AV/module_mixins/_mcmc_mixin.yaml
  # Static rigids layer for static vehicles
  - /model/gaussians/models@model.layers.static_rigids: rigid_gaussians
  - /model/tracks_calib@model.layers.static_rigids.tracks_calib: static
  - /model/gaussians/extra_signal@model.layers.static_rigids.extra_signal: [semantic_logits]
  - /model/gaussians/initialization@model.layers.static_rigids.initialization: camera_dynamic_tracks
  # Temporal appearance for rigid layers
  - /apps/prod/options/temporal_appearance@model.layers.dynamic_rigids: fourier_features_dim_20
  - /apps/prod/options/temporal_appearance@model.layers.static_rigids: fourier_features_dim_20
  # Traffic light layer with step-function time embedding for abrupt state changes
  - /model/gaussians/models@model.layers.traffic_light: rigid_gaussians
  - /model/gaussians/extra_signal@model.layers.traffic_light.extra_signal: [semantic_logits]
  - /model/gaussians/initialization@model.layers.traffic_light.initialization: camera_dynamic_tracks
  - /model/input_embedding@model.layers.traffic_light.time_embed: individual_step_time_gaussian
  - /model/tracks_calib@model.layers.traffic_light.tracks_calib: skip
  - override /model/gaussians/strategy@model.strategy: mcmc
  # Lidarfree initializations
  - override /model/gaussians/initialization@model.layers.dynamic_rigids.initialization: camera_dynamic_tracks
  - override /model/gaussians/initialization@model.layers.dynamic_deformables.initialization: camera_dynamic_tracks
  - override /model/gaussians/initialization@model.layers.background.initialization: accumulated_point_cloud
  - override /model/gaussians/initialization@model.layers.road.initialization: camera_ground_mesh_road
  - override /model/post_processing@model.post_processing.b: ppisp 
  - override /model/post_processing@model.post_processing.c: null
  - override /logger: dummy

loss:
  lidar:
    lambda_: 0.0
  normal:
    lambda_: 0.1  # sugggested default weight is 0.1 when enabled
  gaussian_flatten:
    lambda_: 0.005  # sugggested default weight is 0.005 when enabled
    max_to_median_ratio_threshold: 5.0
  # Supervision by predicted metric depth
  distance:
    fn: log_l1
    reduce:
      name: mean
    lambda_: 0.003
    min_distance: 0.01
    max_distance: 50.0
    allow_missing_supervision: true
    normalize_by_opacity: false
    mask_semantic_classes: ["~sky", "road"]
    semantic_lambdas: [1.0, 2.0]
  node_semantic_gaussians:
    layer_labels_to_exclude:
      background: [road]
      dynamic_rigids: [road]
      dynamic_deformables: [road]
      static_rigids: [road]
      traffic_light: [road]
  background_in_track_gaussian:
    fn: bce_with_logits
    reduce:
      name: mean
    lambda_: 0.1
    layer_names:
      - background  # layer name to suppress
    layer_labels_to_use:
      background: ["person", "rider", "car", "truck", "bus", "train", "motorcycle", "bicycle", "traffic light"] # only penalize these classes in background layer

dataset:
  n_samples_per_epoch: 30_000
  interp_with_rig: false
  lidar_ids:
    - lidar_virtual
  n_train_sample_lidar_rays: 0
  cuboid_tracks_params:
    track_label_sources:
      - AUTOLABEL@camera-DCP
    track_min_distance_m: 10.0
    camera_visibility: true # Use the visible time-intervals for dynamic classification
  generate_static_rigid_cuboid_tracks:
    enabled: true
    visibility_check_camera_ids: ${dataset.camera_ids}
    rigid_classes:
      - "traffic light"
    point_cloud_path: ${dirname:${dataset.path}}/fusion/fused_004.ply

checkpoint:
  every_n_train_steps: ${mul:${trainer.max_epochs},${dataset.n_samples_per_epoch}}

model:
  # disabling calibration for lidar
  calib:
    lidar:
      enabled: false

  strategy:
    add:
      max_n_gaussians: 2_300_000 # Maximum number of Gaussians
    # MCMC won't add, remove, relocate, or perturb road Gaussians.
    # GSplat skips gradient buffer updates, densification (split/clone), and pruning.
    exclude_layer_ids: ["road"]

  layers:
    # Enable temporal appearance for background and dynamic rigids
    background:
      fourier_features_dim: 5
      ignore_classes_from_layers: ["road", "traffic_light"]
      initialization:
        num_point_cloud_points: 650_000
        num_near_points: 100_000
        num_far_points: 100_000
        point_cloud_path: ${dirname:${dataset.path}}/fusion/fused_004.ply
        non_dynamic_points_only: true

    road:
      initialization:
        point_cloud_path: ${dirname:${dataset.path}}/fusion/fused_004.ply
      optimizers:
        - name: fused_adam
          args:
            lr: 0.01
            eps: 1.e-15
            betas: [0.9, 0.99]
          params:
            positions:
              args:
                lr: 0.000001
          scheduler:
            name: ExponentialLR
            interval: step
            args:
              gamma: ${calc_exp_lr_decay_rate:0.01,${mul:${trainer.max_epochs},${dataset.n_samples_per_epoch}}}
        - name: fused_adam
          args:
            lr: 0.01
            eps: 1.e-15
            betas: [0.9, 0.99]
          params:
            densities:
              args:
                lr: 0.0001
            features_albedo:
              args:
                lr: 0.0025
            features_specular:
              args:
                lr: ${div:0.0025,20}
            rotations:
              args:
                lr: 0.0001
            scales:
              args:
                lr: 0.0001
            extra_signal:
              args:
                lr: 0.01
            camera_extra_signal:
              args:
                lr: 0.01
            lidar_extra_signal:
              args:
                lr: 0.01

    dynamic_rigids:
      initialization:
        num_point_cloud_points_in_layer: 300_000
        camera_ids: ${dataset.camera_ids}
        step_frame: 5

    dynamic_deformables:
      initialization:
        num_point_cloud_points_in_layer: 300_000
        camera_ids: ${dataset.camera_ids}
        step_frame: 5

    # Static rigids layer for static vehicles (parked cars, etc.)
    static_rigids:
      tracks:
        label_classes: ${model.layers.dynamic_rigids.tracks.label_classes}
        is_dynamic: false
      initialization:
        num_point_cloud_points_in_layer: 150_000
        camera_ids: ${dataset.camera_ids}
        step_frame: 5
        symmetric_axis: "Y"

    # Traffic light layer with step-function time embedding for abrupt color transitions
    traffic_light:
      class_labels: ["traffic light"]
      is_static: true
      fourier_features_dim: 5
      tracks:
        label_classes:
          ["generated traffic light"]
      initialization:
        keep_all_track_poses: true
        symmetric_axis: null
        camera_ids: ${dataset.camera_ids}
        step_frame: 5

  renderer:
    outputs:
      camera:
        enable_normals: true # Enable normal rendering for normal loss computation
    culling:
      far_clip_distance_camera: 1000.0

  post_processing:
    b:
      # Disable frame-specific optimizations for the PPISP pipeline for two reasons:
      # 1. we don't have a PPISP controller yet.
      # 2. we are using fourier features for the background which interferes with the frame-specific optimizations.
      per_frame_ppisp_enabled: false

system:
  collect_garbage_mem_usage: 0.75  # Trigger when 75% of GPU memory is used, avoid out-of-memory issues due to memory fragmentation in maglev workflows
  collect_garbage_check_interval: 100  # Check memory every 100 steps
