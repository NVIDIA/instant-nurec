# @package _global_

defaults:
  - car2sim
  - override /apps/prod/Hyperion-8.1/options/sensors: hyperion8.1_6cam_1lidar
  - override /model/gaussians/initialization@model.layers.road.initialization: lidar_ground_mesh_road

dataset:
  n_samples_per_epoch: 40_000

model:
  strategy:
    add:
      max_n_gaussians: 2_500_000 # Maximum number of Gaussians
      start_iteration: 20_000
      end_iteration: 35_000

    relocate:
      end_iteration: 35_000

    perturb:
      start_iteration: 1
      end_iteration: ${dataset.n_samples_per_epoch}
      frequency: 1

    # MCMC won't add, remove, relocate, or perturb road Gaussians.
    # GSplat skips gradient buffer updates, densification (split/clone), and pruning.
    exclude_layer_ids: ["road"]

  layers:
    road:
      # Road geometry is initialized from the ground mesh and kept near-frozen during training.
      # Only appearance (features_albedo) learns at a normal rate; positions, rotations, scales,
      # and densities use very low LRs to preserve mesh-derived geometry.
      # The road layer is also excluded from MCMC add/relocate/perturb (see exclude_layer_ids).
      initialization:
        num_random_points: 0
      optimizers:
        - name: fused_adam
          args:
            lr: 0.01
            eps: 1.e-15
            betas: [0.9, 0.99]
          params:
            positions:
              args:
                lr: 0.000001      # very low (default: 0.00016)
          scheduler:
            name: ExponentialLR
            interval: step
            args:
              gamma: ${calc_exp_lr_decay_rate:0.01,${mul:${trainer.max_epochs},${dataset.n_samples_per_epoch}}}
        - name: fused_adam
          args:
            lr: 0.01
            eps: 1.e-15
            betas: [0.9, 0.99]
          params:
            densities:
              args:
                lr: 0.0001        # very low (default: 0.05)
            features_albedo:
              args:
                lr: 0.0025        # keep reasonable (default: 0.0025)
            features_specular:
              args:
                lr: ${div:0.0025,20}
            rotations:
              args:
                lr: 0.0001        # very low (default: 0.001)
            scales:
              args:
                lr: 0.0001        # very low (default: 0.005)
            extra_signal:
              args:
                lr: 0.01
            camera_extra_signal:
              args:
                lr: 0.01
            lidar_extra_signal:
              args:
                lr: 0.01

loss:
  lidar:
    lambda_: 0.005

checkpoint:
  artifact:
    mesh:
      ground:
        colored: false

system:
  test:
    val_render_selected_nodes:
      road_only:
        - road
      background_only:
        - background
