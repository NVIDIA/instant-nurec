# @package _global_
# Owner: nicolasm

# Reference 3DGUT NRend configuration file for testing the NRend library integration :
# - to evaluate and debug the rendering accuracy
# - to evaluate the rendering performances
# - to create unittests.

# order in which configs override each other (/* - denotes a relative search path)
defaults:
  - /apps/AV/NV/3dgut_dynamic.yaml
  - override /system: nrend_test_gaussians
  - override /model/background: sky_env_map
  - override /model/post_processing@model.post_processing.b: null
  - override /model/post_processing@model.post_processing.c: null

loss:
  normal:
    fn: l1
    reduce:
      name: mean
    lambda_: 0.1
  gaussian_flatten:
    fn: abs
    reduce:
      name: mean
    axes_type: fixed
    max_to_median_ratio_threshold: 1.0
    allow_missing_supervision: false
    lambda_: 0.005

dataset:
  n_train_sample_lidar_rays: 0

model:
  layers:
    background:
      particle:
        density_kernel_min_response: 0.0113
    dynamic_deformables:
      particle:
        density_kernel_min_response: 0.0113
    dynamic_rigids:
      particle:
        density_kernel_min_response: 0.0113

system:
  test:
    nrend:
      enabled: True
      log_level: 4
