# @package _global_
# Owner: nicolasm

# Reference 3DGUT NRend configuration file for testing the NRend library integration :
# - to evaluate and debug the rendering accuracy
# - to evaluate the rendering performances
# - to create unittests.

# order in which configs override each other (/* - denotes a relative search path)
defaults:
  - /apps/prod/Hyperion-8.1/car2sim_quality.yaml
  - /apps/AV/module_mixins/_mcmc_mixin.yaml
  - override /system: nrend_test_gaussians
  
model:
  # 800k background points + 200k random points + 300k dynamic rigids + 300k dynamic deformables + 200k road points = 1.8m points
  layers:
    background:
      initialization:
        num_point_cloud_points: 800_000
        num_near_points: 100_000
        num_far_points: 100_000
    dynamic_rigids:
      initialization:
        num_point_cloud_points_in_layer: 300_000
      fourier_features_dim: 1 # 20 to 1 : NRend does not support temporal appearance for dynamic rigids
    dynamic_deformables:
      initialization:
        num_point_cloud_points_in_layer: 300_000
    road:
      initialization:
        num_point_cloud_points: 200_000
    traffic_light:
      fourier_features_dim: 1 # 5 to 1 : NRend does not support temporal appearance for traffic lights

  strategy:
    mcmc:
      add:
        max_n_gaussians: 1800000 # Maximum number of Gaussians

system:
  test:
    nrend:
      enabled: True
      log_level: 4
