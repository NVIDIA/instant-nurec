defaults:
  - base

# The 'direct'-calibration module introduces learnable delta SE3 in the training by 
# delta-transforming (timestamped) cuboids.

name: direct-tracks-calib
start_global_step: 500       # freeze all estimated parameters until this global optimization step
log_to_prog_bar: false       # if enabled, include statistics on estimated deltas of extrinsics / poses in the console log

fix_first_pose: true         # fix the first pose of the cuboid
fix_last_pose: true          # fix the last pose of the cuboid

optimizer:
  name: fused_adam
  args:
    lr: 1.0e-5
    eps: 1.e-15
    betas: [0.9, 0.99]
scheduler:
  name: SequentialLR
  interval: step
  milestones:
    - ${...start_global_step}
    - ${add:${...start_global_step},${system.warmup_steps}}

  schedulers:
    - name: ConstantLR # skip until `start_global_step`
      args:
        factor: 0.0
        total_iters: ${.....start_global_step}
    - name: LinearLR # linear warm-up in the first system.warmup_steps steps
      interval: step
      args:
        start_factor: 0.01
        end_factor: 1.0
        total_iters: ${system.warmup_steps}
    - name: StepFunCosineAnnealingLR
      interval: step
      args:
        T_max: ${sub:${mul:${trainer.max_epochs},${dataset.n_samples_per_epoch}},${add:${.....start_global_step},${system.warmup_steps}}}
        min_factor: 0.0333
        update_every_n_steps: ${trainer.annealing_update_every_n_steps}
