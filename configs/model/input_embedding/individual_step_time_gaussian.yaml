name: individual-step-time-input-embedding

# The embedding outputs an `n_dims`-dimensional vector, with each dimension being a
# staircase function w.r.t. time.
# Each staircase function has `n_steps` steps, and the step transition point is learned.
n_steps: 15
n_dims: 1
# Whether to learn the step transition point.
requires_grad: true
# The steepness of the step function is controlled by beta, representing the timestamps_us
# required to go from one step to the next.
# Set the constant beta for the step function
update_stepness: false
beta:
  start_timestamps_us: 100000

# Reference to trainer config for adjusting values based on world size
trainer: ${trainer}

optimizer:
  name: fused_adam
  args:
    lr: 5.e-4
    eps: 1.e-15
    betas: [0.9, 0.99]
scheduler:
  name: StepFunCosineAnnealingLR
  interval: epoch
  args:
    T_max: ${trainer.max_epochs}
    min_factor: 0.0333