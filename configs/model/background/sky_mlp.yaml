name: sky-mlp
saturate_radiance: ${model.saturate_radiance}
dir_encoding_config:
  otype: HashGrid
  n_levels: 16
  n_features_per_level: 2
  log2_hashmap_size: 19
  base_resolution: 16
  max_resolution: 4096
mlp_network_config:
  otype: FullyFusedMLP
  activation: ReLU
  output_activation: ${eval:'"Sigmoid" if ("${model.saturate_radiance}") else "ReLU"'}
  n_neurons: 64
  n_hidden_layers: 2
enable_jit_if_supported: true
seed: ${seed}
composite_in_linear_space: false