# @package _global_
# Owner: Shikhar Solanki

ncore_parser:
  target_resolution: 512
  num_lidar_ref_frames: 16
  cam_pose_flip: [1, 1, -1]
  max_threads: 4
  occ_rate_threshold: 0.3
  crop_min_area_ratio: 0.002
  mask_exceed_threshold: 0.1
  min_instance_pixels: 200
  mask_overlap_threshold: 0.5
  camera_ids:
    - "camera_cross_left_120fov"
    - "camera_cross_right_120fov"
    - "camera_front_wide_120fov"
    - "camera_rear_right_70fov"
    - "camera_rear_left_70fov"

tokengs_lifting:
  use_ttt: false
  bbox_size: 1.0

output:
  # Per-class rigid rotation applied to each gaussians.ply after lifting save.
  # TokenGS outputs in OpenGL Y-up; vehicle/rider classes end up 180° flipped
  # without a yaw correction.
  rotation:
    by_class:
      automobile:
        axis: y
        degrees: -90.0
      rider:
        axis: y
        degrees: -90.0
      heavy_truck:
        axis: y
        degrees: -90.0
      trailer:
        axis: y
        degrees: -90.0
      person:
        axis: y
        degrees: -90.0
      other_vehicle:
        axis: y
        degrees: -90.0

urls:
  mv_diffusion_ckpt: https://api.ngc.nvidia.com/v2/org/nvstaging/team/nre/models/asset_harvester/versions/1.6/files/AH_multiview_diffusion.safetensors
  tokengs_ckpt: https://api.ngc.nvidia.com/v2/org/nvstaging/team/nre/models/asset_harvester/versions/1.6/files/AH_tokengs_lifting.safetensors
  segmentation_ckpt: https://api.ngc.nvidia.com/v2/org/nvstaging/team/nre/models/asset_harvester/versions/1.6/files/AH_object_seg_jit.pt
