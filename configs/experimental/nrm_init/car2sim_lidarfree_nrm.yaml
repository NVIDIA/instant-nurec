# @package _global_

defaults:
  - /apps/prod/Hyperion-8.1/car2sim_lidarfree
  - override /model/gaussians/initialization@model.layers.background.initialization: nrm_ply
  - override /model/gaussians/initialization@model.layers.road.initialization: nrm_road_ply

loss:
  distance:
    lambda_: 0.0
  gaussian_flatten:
    lambda_: 0.0
  normal:
    lambda_: 0.0

model:
  layers:
    background:
      initialization:
        num_point_cloud_points: 850000
        point_cloud_path: null # null as not used here. This is set in car2sim_lidarfree and refers to the point cloud path for the lidarfree's default initialization
        num_near_points: null
        num_far_points: null
        non_dynamic_points_only: null
    road:
      initialization:
        num_point_cloud_points: 400000
        point_cloud_path: null # null as not used here. This is set in car2sim_lidarfree and refers to the point cloud path for the lidarfree's default initialization
    dynamic_rigids:
      initialization:
        fill_with_random_points: true
        camera_ids: []
    dynamic_deformables:
      initialization:
        fill_with_random_points: true
        camera_ids: []
    static_rigids:
      initialization:
        fill_with_random_points: true
        camera_ids: []
