# Holdout batch sampler
holdout_batch_sampler:
  name: default # Type of the batch sampler
  ratio_camera_samples: 1.0 # ratio of the camera samples that will come from this sampler
  ratio_lidar_samples: 1.0 # ratio of the lidar samples that will come from this sampler
  update_n_epochs: 0 # Define how often to update the sampler, compulsory field
  
  camera_sensor_sampler:
    name: uniform # Type of the camera sensor sampler one of [uniform, skip]
    sample_all_sensors: true # If true, a frame from each sensor will be sampled in every batch
  camera_frame_sampler:
    name: holdout # Type of the camera frame sampler one of [uniform, timestamp, holdout, skip]
    # Training set to include frames excluded from the validation set or vice-versa.
    include_frames_start: ${....val_camera_exclude_frame_start}
    include_every_n_frames: ${....val_camera_exclude_frame_step}
    exclude_frames_start: ${....val_camera_frame_start}
    exclude_every_n_frames: ${....val_camera_frame_step}
  camera_pixel_sampler:
    name: uniform # Type of the camera frame sampler one of [uniform, image-crop, skip]

  lidar_sensor_sampler:
    name: uniform # Type of the lidar sensor sampler one of [uniform, skip]
    sample_all_sensors: true # If true, a frame from each sensor will be sampled in every batch
  lidar_frame_sampler:
    name: holdout  # Type of the lidar frame sampler one of [uniform, timestamp, holdout, skip]
    include_frames_start: ${eval:'0 if "...val_lidar==False" else ....val_lidar_exclude_frame_start'}
    include_every_n_frames: ${eval:'1 if "...val_lidar==False" else ....val_lidar_exclude_frame_step'}
    exclude_frames_start: ${eval:'None if "...val_lidar==False" else ....val_lidar_frame_start'}
    exclude_every_n_frames: ${eval:'None if "...val_lidar==False" else ....val_lidar_frame_step'}
  lidar_point_sampler:
    name: uniform # Type of the lidar point sampler one of [uniform, semantic, skip, lidar-crop]
