batch_sampler:
  name: default # Type of the batch sampler
  ratio_camera_samples: 1.0 # ratio of the camera samples that will come from this sampler
  ratio_lidar_samples: 1.0 # ratio of the lidar samples that will come from this sampler
  update_n_epochs: 0 # Define how often to update the sampler, compulsory field
  
  camera_sensor_sampler:
    name: uniform # Type of the camera sensor sampler one of [uniform, skip]
    sample_all_sensors: false # If true, a frame from each sensor will be sampled in every batch
  camera_frame_sampler:
    name: uniform # Type of the camera frame sampler one of [uniform, timestamp, holdout, skip]
  camera_pixel_sampler:
    name: image-crop # Type of the camera frame sampler one of [uniform, image-crop, skip]
    crop_type: full_image # possible values: [full_image, preset_roi, random_crop]
    subsample: 1 # subsample factor of the cropped region
    roi_lt: null # the left top point of preset roi: (x, y). The x, y are normalized by image width and height respectively. In [0,1]
    roi_rb: null # the right bottom point of preset roi: (x, y). The x, y are normalized by image width and height respectively. In [0,1]
    crop_ratio: null  # the crop ratio (crop_width / orig_width and crop_height / orig_height). In (0, 1)

  lidar_sensor_sampler:
    name: uniform # Type of the lidar sensor sampler one of [uniform, skip]
    sample_all_sensors: true # If true, a frame from each sensor will be sampled in every batch
  lidar_frame_sampler:
    name: uniform # Type of the lidar frame sampler one of [uniform, timestamp, holdout, skip]
  lidar_point_sampler:
    name: lidar-crop # Type of the lidar point sampler one of [uniform, semantic, skip, lidar-crop]
    subsample: 1 # subsample factor of the cropped region
