# @package _global_
# Test data loading: TestIndexNRMDataset + prints batch indices each training epoch.
#
# Run:
#   bazel run //nre/nrm:run -- --config-name=configs/nrm/apps/experimental/test_data_system

defaults:
  - /nrm/apps/celsius_base: _static_full

dataset:
  name: nrm

  train:
    name: nrm-test-index
    size: 20

  val:
    name: nrm-test-index
    size: 10

  test:
    name: nrm-test-index
    size: 10

system:
  name: test-data-system
  warmup_steps: 0
  optimizer:
    name: fused_adam
    args:
      lr: 1e-4

  max_epochs: 5
  check_val_every_n_epoch: 1
  precision: 32
  num_sanity_val_steps: 0

  train_num_workers: 1
  train_batch_size: 1

  val_num_workers: 1
  val_batch_size: 1

  test_num_workers: 1
  test_batch_size: 1

out_dir: /tmp/nrm_test_data_system

resume: auto
preempt_on_interrupt: true
