# @package _global_
# Owner: mtyszkiewicz

# order in which configs override each other (/* - denotes a relative search path)
defaults:
  - /nrm/apps/kelvin_base: _base
  - /nrm/model@model: kelvin_tokengs

  # Data (DL3DV only, no re10k)
  - /nrm/dataset/concrete@dataset.train: dv_dl3dv_ord_train
  - /nrm/dataset/concrete@dataset.val: dv_dl3dv_ord_train
  - /nrm/dataset/concrete@dataset.test: dv_dl3dv_ord_train

system:
  train_batch_size: 8
  val_batch_size: 8
  test_batch_size: 8
  max_epochs: 35

  warmup_steps: 1000

  optimizer:
    name: fused_adam
    args:
      lr: 4e-4
      eps: 1.e-15
      betas: [0.9, 0.99]

dataset:
# training mixture is replicated, test/val is subsampled by to 10% of the dataset (may need further tuning for reasonable runtime)
  val:
    mixture: &test_val_mixture
      dataverse-dl3dv:
        sample_ratio: 0.1
  test:
    mixture: *test_val_mixture
  
model:
  # Kelvin per-camera RGB affine (post_processing); false = identity at render time, no extra params.
  post_processing:
    enabled: false
  renderer:
    # Use gsplat instead of nrend to align with the btimer codebase.
    # We don't need 3DGUT (3dgut-gsplat) for dataverse experiments.
    name: 3dgs-gsplat
  
    # this is the default for 3DGS, we make it explicit to make it clearer what to modify later
    projection:
      ut_dim: 3
    use_2dgs: false
  # Path to legacy TokenGS checkpoint (.safetensors or .ckpt). Override from CLI: +model.init_weights_paths.tokengs=/path
  init_weights_paths: {}
  encoder:
    depth: 24
    layer_scale_init_values: 0.01  # legacy tokengs encoder uses 0.01
  decoder:
    depth: 1
    num_gaussian_tokens: 4096
    gaussian_token_init_std: 0.01  # legacy tokengs gs_token_std
    layer_scale_init_values: 5.e-5  # legacy tokengs: 5e-3 * gs_token_std (0.01)
    use_decoder_norm: false  # legacy TokenGS has no backbone_norm after decoder
  activations:
    scale_max: 0.075
  # use a smaller scene rescale to have a mean depth of 1
  scene_rescale: 0.15

loss:
  ssim:
    lambda_: 0.1
  primitive_visibility_regularization:
    lambda_: 0.01