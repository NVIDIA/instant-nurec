# @package _global_

# Switch below between static and dynamic model
defaults:
  - local_dav3_context
  - override /loss/nrm@loss: kelvin_dav3_render

system:
  enable_render_global_step: 0

model:
  freeze_encoder: true
  # Required: provide the full-model checkpoint via CLI override, e.g.
  #   +model.init_weights_paths.full=/nrm_debug/checkpoints/<RUN_NAME>/last.ckpt
  post_processing:
    optimization_start_global_step: 1000
