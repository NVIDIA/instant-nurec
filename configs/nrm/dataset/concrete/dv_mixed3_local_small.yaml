  dataverse-dl3dv:
    sample_ratio: 1.0
    config:
      frame_batch_samplers:
        varying_interval:
          sequence_gap_timestamp_us_min: 15
          sequence_gap_timestamp_us_max: 30
          n_samples_per_sequence: 30

      subset_spec:
        target: "dl3dv.DL3DV10K"
        root_path: "/nrm_debug/data/dataverse/dl3dv"

