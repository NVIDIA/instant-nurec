defaults:
  - ../mixed@_here_
  - /nrm/dataset@mixture.dataverse-re10k.config: dataverse
  - /nrm/dataset@mixture.dataverse-dl3dv.config: dataverse

name: nrm-mixed

shared_config: {}

mixture:
  dataverse-re10k:
    sample_ratio: 1.0
    config:
      frame_batch_samplers:
        varying_interval:
          sequence_gap_timestamp_us_min: 45
          sequence_gap_timestamp_us_max: 192
          n_samples_per_sequence: 4

      subset_spec:
        target: "re10k.RealEstate10K"
        root_path: "/nrm_debug/data/dataverse/re10k"
        annotation_json: "/nrm_debug/data/dataverse/re10k/train_all.json"

  # [REMOVED SINCE THIS IS NOT SCENE DATASET]    
