rgb:
  fn: mse
  reduce:
    name: mean
  lambda_: 1.0
  # Use lower weight for synthetic views
  # For static models, hood and dynamic objects will be marked as invalid.
  mask_semantic_classes: ["~synthetic", "synthetic"]
  semantic_lambdas: [1.0, 0.25]

# SSIM is disabled in favor of LPIPS loss,
# and we add this loss no matter the view is synthetic or not
lpips:
  fn: lpips
  reduce:
    name: mean
  lambda_: 0.2
  limit_max_resolution: 512

distance:
  fn: depth_inverse_mse
  reduce:
    name: mean
  lambda_: 1.0
  min_distance: 0.1
  max_distance: 50.0
  normalize_by_opacity: true
  allow_missing_supervision: true
  mask_semantic_classes: ["~synthetic"]
  semantic_lambdas: [1.0]

# More or less a regularization.
primitive_sky_cubemap:
  fn: l1
  reduce:
    name: mean
  masked_region: "smooth"
  lambda_: 1.0

# [can also not add - sky region might be color shifted]
primitive_rgb:
  fn: l1
  reduce:
    name: mean
  lambda_: 0.1
  lambda_scheduler:
    name: linear_lambda
    start: 500
    end: 1000
    update_interval: "step"
    update_frequency: 1
    lambda_end: 1e-3

# [can also not add - training will be stabler]
background:
  fn: mse
  reduce:
    name: mean
  lambda_: 0.05

# End regularization losses

primitive_distance:
  fn: l1
  min_distance: 0.1
  max_distance: 50.0
  sky_distance: 400.0
  mask_semantic_classes: ["~sky", "sky"]
  semantic_lambdas: [1.0, 0.002]
  use_z_depth: false
  lambda_: 1.0
  confidence_alpha_: 0.2
  reduce:
    name: mean

primitive_distance_gradient:
  fn: abs
  min_distance: 0.1
  max_distance: 50.0
  use_z_depth: false
  lambda_: 1.0
  confidence_alpha_: 0.2
  reduce:
    name: mean
  scale_steps: [1, 2, 4, 8]
  scale_lambdas: [1.0, 1.0, 1.0, 1.0]

# Removed pointmap losses since we no longer predict it.
# The original configuration is the same as above, except for distance -> pointmap.

primitive_semantics:
  fn: cross_entropy
  reduce:
    name: mean
  lambda_: 0.01

primitive_velocity:
  fn: l1
  mask_semantic_classes: ["vehicle", "~vehicle"]
  semantic_lambdas: [1.0, 0.1]
  reduce:
    name: mean
  lambda_: 1.0
